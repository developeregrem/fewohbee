openapi: 3.1.0
info:
  title: FewohBee REST API
  version: '1.0'
  description: |
    Read-only REST API of the FewohBee property management system.

    Authentication uses personal access tokens created in the user profile
    ("API access"). A token always starts with `fwb_` and can be sent either as
    `Authorization: Bearer <token>` or — for clients that only support
    username/password, such as calendar applications — as the password in HTTP
    Basic auth together with the token owner's username. The actual login
    password is never accepted by the API.

    Every token carries scopes. A scope only takes effect when the token owner
    also holds the underlying application role, so a token can never grant more
    than its owner has.

    | Scope | Required role |
    |---|---|
    | `reservations:read` | ROLE_RESERVATIONS_RO |
    | `calendar:read` | ROLE_RESERVATIONS_RO |
    | `statistics:read` | ROLE_STATISTICS |
    | `invoices:read` | ROLE_INVOICES |
    | `prices:read` | ROLE_RESERVATIONS_RO |
    | `tourist-tax:read` | ROLE_OPERATIONS |
    | `subsidiaries:read` | ROLE_RESERVATIONS_RO |

    Requests are rate limited to 300 per 5 minutes per token.
  license:
    name: AGPL-3.0
    url: https://github.com/developeregrem/fewohbee/blob/master/LICENSE

servers:
  - url: '{baseUrl}/api/v1'
    description: Your FewohBee installation
    variables:
      baseUrl:
        default: https://your-installation
        description: >-
          Base URL of the installation, including a subdirectory if the app is
          not served from the domain root (e.g. https://example.com/fewohbee).

security:
  - bearerAuth: []
  - basicAuth: []

tags:
  - name: Reservations
    description: Bookings in a date range, classified by arrival, departure and in-house.
  - name: Invoices
    description: >-
      Issued invoices with their line items and VAT breakdown. Authoritative for what a
      stay was actually billed. Payment credentials are never exposed.
  - name: Prices
    description: >-
      The configured price catalogue, the per-night rate calendar, and price quotes.
      Only the quote computes amounts — see its description before deriving money from
      the catalogue.
  - name: Tourist tax
    description: >-
      Tourist tax (Kurtaxe / city tax) configuration and the monthly report a municipality
      filing is built from.
  - name: Subsidiaries
    description: >-
      Branch master data including the weekly opening hours, so a website or home
      automation can print them from one place instead of keeping a second copy.
  - name: Calendars
    description: iCal export of a room's occupancy, public holidays, and custom calendars.
  - name: Statistics
    description: >-
      Utilization, booking origins and turnover, keyed by ISO months and years rather than
      localized labels.
  - name: Meta
    description: The machine-readable description of this API.

paths:
  /reservations:
    get:
      tags: [Reservations]
      operationId: listReservations
      summary: List reservations in a date range
      description: |
        Requires the `reservations:read` scope.

        `types` describes each reservation relative to the requested range:
        `arrival` if the arrival day falls inside it, `departure` if the
        departure day does, and `inhouse` if at least one day of the range lies
        strictly between arrival and departure. Over a multi-day range several
        types can apply at once; when querying a single day exactly one type is
        returned.
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/ObjectId'
        - name: apartmentId
          in: query
          description: Restrict to a single room.
          schema: { type: integer }
        - $ref: '#/components/parameters/ReservationStatusId'
        - name: type
          in: query
          description: Only reservations that have this type within the range.
          schema:
            type: string
            enum: [arrival, departure, inhouse]
      responses:
        '200':
          description: Matching reservations. The range must not exceed 180 days.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Reservation' }
                  meta:
                    type: object
                    properties:
                      start: { type: string, format: date }
                      end: { type: string, format: date }
                      count: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /invoices:
    get:
      tags: [Invoices]
      operationId: listInvoices
      summary: List invoices in a date range
      description: |
        Requires the `invoices:read` scope.

        Invoices contain the recipient's name and address. Payment credentials
        (IBAN, card number, card holder, mandate reference) are never returned.
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: status
          in: query
          description: >-
            Invoice status IDs (1 = open, 2 = paid, 3 = prepaid, 4 = canceled).
            Repeatable or comma-separated. Default: all.
          schema:
            oneOf:
              - type: string
              - type: array
                items: { type: integer, enum: [1, 2, 3, 4] }
            examples: ['1,2']
      responses:
        '200':
          description: Matching invoices. The range must not exceed 366 days.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Invoice' }
                  meta:
                    type: object
                    properties:
                      start: { type: string, format: date }
                      end: { type: string, format: date }
                      status:
                        type: array
                        items: { type: integer }
                      count: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /invoices/{id}:
    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Get a single invoice
      description: Requires the `invoices:read` scope.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The invoice.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /apartments/{id}/calendar.ics:
    get:
      tags: [Calendars]
      operationId: getApartmentCalendar
      summary: Occupancy calendar of a room in iCal format
      description: |
        Requires the `calendar:read` scope.

        Unlike the public calendar URL (which contains an unguessable UUID and
        requires the calendar to be shared publicly), this endpoint works for
        any active room with calendar synchronisation configured. Calendar
        applications such as Thunderbird can subscribe to it using HTTP Basic
        auth with the username and an API token as the password.
      parameters:
        - name: id
          in: path
          required: true
          description: Room (apartment) ID.
          schema: { type: integer }
      responses:
        '200':
          description: The calendar.
          content:
            text/calendar:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /calendar/holidays:
    get:
      tags: [Calendars]
      operationId: listHolidays
      summary: Public holidays for a country / subdivision
      description: |
        Requires the `calendar:read` scope.

        Without a subdivision the holidays of the whole country including all of
        its subdivisions are returned; with a subdivision only the ones valid
        there.
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: country
          in: query
          description: 'ISO 3166-1 country code. Default: DE.'
          schema: { type: string, default: DE, examples: [DE] }
        - name: subdivision
          in: query
          description: ISO 3166-2 subdivision code belonging to the country.
          schema: { type: string, examples: [DE-SN] }
        - name: locale
          in: query
          description: 'Language of the holiday names. Default: request language.'
          schema: { type: string, examples: [de] }
      responses:
        '200':
          description: Holidays in the range. The range must not exceed 731 days.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Holiday' }
                  meta:
                    type: object
                    properties:
                      start: { type: string, format: date }
                      end: { type: string, format: date }
                      country: { type: string }
                      subdivision: { type: [string, 'null'] }
                      locale: { type: string }
                      count: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /calendars:
    get:
      tags: [Calendars]
      operationId: listCalendars
      summary: List the user-defined calendars
      description: Requires the `calendar:read` scope.
      responses:
        '200':
          description: All configured calendars.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Calendar' }
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /calendars/{id}/entries:
    get:
      tags: [Calendars]
      operationId: listCalendarEntries
      summary: Entries of a calendar in a date range
      description: Requires the `calendar:read` scope.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Entries in the range. The range must not exceed 731 days.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CalendarEntry' }
                  meta:
                    type: object
                    properties:
                      start: { type: string, format: date }
                      end: { type: string, format: date }
                      calendar:
                        type: object
                        properties:
                          id: { type: integer }
                          name: { type: string }
                      count: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /statistics/utilization:
    get:
      tags: [Statistics]
      operationId: getUtilizationStatistics
      summary: Bed utilization per month
      description: |
        Requires the `statistics:read` scope. Utilization is given in percent of
        the available beds.
      parameters:
        - $ref: '#/components/parameters/StartMonth'
        - $ref: '#/components/parameters/EndMonth'
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/ReservationStatusId'
      responses:
        '200':
          description: One entry per month. The range must not exceed 60 months.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        month: { type: string, examples: ['2026-08'] }
                        utilization: { type: number, format: float }
                  meta:
                    type: object
                    properties:
                      start: { type: string }
                      end: { type: string }
                      objectId: { type: [integer, 'null'] }
                      beds: { type: integer }
                      count: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /statistics/origins:
    get:
      tags: [Statistics]
      operationId: getOriginStatistics
      summary: Reservation counts per booking origin
      description: Requires the `statistics:read` scope.
      parameters:
        - $ref: '#/components/parameters/StartMonth'
        - $ref: '#/components/parameters/EndMonth'
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/ReservationStatusId'
      responses:
        '200':
          description: One entry per origin. The range must not exceed 60 months.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: [string, 'null'] }
                        count: { type: integer }
                  meta:
                    type: object
                    properties:
                      start: { type: string }
                      end: { type: string }
                      objectId: { type: [integer, 'null'] }
                      count: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /statistics/turnover:
    get:
      tags: [Statistics]
      operationId: getTurnoverStatistics
      summary: Turnover per year or month
      description: |
        Requires the `statistics:read` scope. Turnover is the gross amount based
        on invoices.
      parameters:
        - name: start
          in: query
          description: 'First year (YYYY). Default: current year.'
          schema: { type: string, pattern: '^\d{4}$', examples: ['2026'] }
        - name: end
          in: query
          description: 'Last year (YYYY). Default: same as start.'
          schema: { type: string, pattern: '^\d{4}$', examples: ['2026'] }
        - name: granularity
          in: query
          schema: { type: string, enum: [year, month], default: year }
        - name: invoiceStatus
          in: query
          description: >-
            Invoice status IDs to include (1 = open, 2 = paid, 3 = prepaid,
            4 = canceled). Repeatable or comma-separated.
            Default: 1,2,3 (everything except canceled).
          schema:
            oneOf:
              - type: string
              - type: array
                items: { type: integer, enum: [1, 2, 3, 4] }
      responses:
        '200':
          description: >-
            One entry per year or month, depending on granularity. The range must
            not exceed 5 years.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        year: { type: integer, description: Only with granularity=year. }
                        month: { type: string, description: 'Only with granularity=month, e.g. 2026-08.' }
                        turnover: { type: number, format: float }
                  meta:
                    type: object
                    properties:
                      start: { type: integer }
                      end: { type: integer }
                      granularity: { type: string }
                      invoiceStatus:
                        type: array
                        items: { type: integer }
                      count: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /prices:
    get:
      tags: [Prices]
      operationId: listPrices
      summary: The configured price catalogue
      description: |
        Requires the `prices:read` scope.

        Reference data: which price rows exist and when they apply. Working out what a
        stay costs from these fields means reimplementing period priority, weekday
        matching, minStay selection and the guest-category modifiers, and the result
        will drift from the invoice. Use `/prices/quote` for amounts.
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [apartment, misc] }
          description: Apartment (room) prices or miscellaneous prices; both when omitted.
        - name: roomCategoryId
          in: query
          schema: { type: integer }
        - name: originId
          in: query
          description: One or more reservation origin ids (repeatable or comma separated).
          schema: { type: string }
        - name: active
          in: query
          schema: { type: string, enum: ['true', 'false', 'all'], default: 'true' }
        - name: bookableOnline
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: The matching price rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Price' }
                  meta:
                    type: object
                    properties:
                      type: { type: [string, 'null'] }
                      roomCategoryId: { type: [integer, 'null'] }
                      originIds: { type: [array, 'null'], items: { type: integer } }
                      active: { type: [boolean, 'null'] }
                      bookableOnline: { type: [boolean, 'null'] }
                      count: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /prices/quote:
    get:
      tags: [Prices]
      operationId: getPriceQuote
      summary: What a stay would cost
      description: |
        Requires the `prices:read` scope.

        Computed through the same pipeline that produces the invoice, so a quote and the
        later invoice agree as long as nobody edits the invoice by hand. A quote is never
        a document — the authoritative amount for a billed stay is the invoice itself.

        `priceFound: false` means no price row applies to this apartment, occupancy and
        period. That is different from a stay that genuinely costs nothing; all totals
        are `0.0` in that case, so never read a `0.00` total as "free".

        `touristTax` and `grandTotal` are `null` when the token lacks the
        `tourist-tax:read` scope, so "not permitted to see it" stays distinguishable
        from "no tourist tax applies".
      parameters:
        - name: apartmentId
          in: query
          required: true
          schema: { type: integer }
        - name: start
          in: query
          required: true
          description: Arrival date (Y-m-d).
          schema: { type: string, format: date }
        - name: end
          in: query
          required: true
          description: Departure date (Y-m-d), exclusive. 1st to 8th is seven nights.
          schema: { type: string, format: date }
        - name: persons
          in: query
          description: >-
            Occupancy the apartment price is matched against. Required unless
            `guestCounts` carries occupancy-counted guests, in which case it defaults
            to their sum.
          schema: { type: integer, minimum: 1 }
        - name: guestCounts
          in: query
          style: deepObject
          explode: true
          description: >-
            Head count per guest category, as `guestCounts[categoryId]=count`. Drives
            the guest-category modifiers (child rates, extra-bed surcharges) and the
            tourist tax. Omit for a plain list price.
          schema:
            type: object
            additionalProperties: { type: integer, minimum: 0 }
        - $ref: '#/components/parameters/OriginId'
      responses:
        '200':
          description: The quote. The stay must not exceed 366 nights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PriceQuote' }
                  meta:
                    type: object
                    properties:
                      touristTaxIncluded: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /prices/rates:
    get:
      tags: [Prices]
      operationId: getRateCalendar
      summary: Per-night, per-occupancy rate calendar
      description: |
        Requires the `prices:read` scope.

        The rate for a night is not a property of that night alone: candidate prices are
        filtered by `minStay` and matched on occupancy exactly. Both are parameters here
        rather than assumptions, so the per-night rate of a seven-night stay
        (`nights=7`) can legitimately differ from the single-night rate (`nights=1`).

        A night with no applicable price comes back with an empty `rates` array.
      parameters:
        - name: roomCategoryId
          in: query
          description: Required unless `apartmentId` is given.
          schema: { type: integer }
        - name: apartmentId
          in: query
          description: Alternative to `roomCategoryId` — the room's category is used.
          schema: { type: integer }
        - name: start
          in: query
          description: First night (Y-m-d). Defaults to today.
          schema: { type: string, format: date }
        - name: end
          in: query
          description: Last night (Y-m-d), inclusive. Defaults to `start`.
          schema: { type: string, format: date }
        - name: nights
          in: query
          description: Intended stay length, drives minStay selection.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: occupancy
          in: query
          description: >-
            Single occupancy to report. Defaults to every occupancy the category has an
            active price for.
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/OriginId'
      responses:
        '200':
          description: One entry per night. The range must not exceed 500 days.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        rates:
                          type: array
                          items: { $ref: '#/components/schemas/Rate' }
                  meta:
                    type: object
                    properties:
                      start: { type: string }
                      end: { type: string }
                      nights: { type: integer }
                      roomCategoryId: { type: [integer, 'null'] }
                      occupancies: { type: array, items: { type: integer } }
                      origin:
                        type: object
                        properties:
                          id: { type: integer }
                          name: { type: [string, 'null'] }
                      count: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /tourist-taxes:
    get:
      tags: [Tourist tax]
      operationId: listTouristTaxes
      summary: The configured tourist taxes
      description: |
        Requires the `tourist-tax:read` scope.

        Configuration, not amounts. A `per_night_flat` tax carries a tariff per guest
        category; a `percent_per_room` tax is a percentage of the apartment total and
        therefore has no per-night figure at all. What a stay owes comes from
        `/prices/quote`, what a month owes from `/tourist-taxes/report`.
      responses:
        '200':
          description: All configured tourist taxes, active ones first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TouristTax' }
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /tourist-taxes/report:
    get:
      tags: [Tourist tax]
      operationId: getTouristTaxReport
      summary: Monthly tourist-tax report
      description: |
        Requires the `tourist-tax:read` scope.

        The figures a municipality filing is built from, aggregated per month, per tax
        and per report group (falling back to the guest category when a rate defines no
        group). Amounts are live-calculated per reservation through the same service the
        invoice uses, not read off invoices, so report and invoice cannot drift apart.

        A tax valid in a month with no matching reservations still appears, with zero
        totals — an explicit nil return rather than a missing row.
      parameters:
        - $ref: '#/components/parameters/StartMonth'
        - $ref: '#/components/parameters/EndMonth'
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/ReservationStatusId'
      responses:
        '200':
          description: One entry per month. The range must not exceed 36 months.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        month: { type: string, examples: ['2026-09'] }
                        total: { type: number }
                        taxes:
                          type: array
                          items: { $ref: '#/components/schemas/TouristTaxReportRow' }
                  meta:
                    type: object
                    properties:
                      start: { type: string }
                      end: { type: string }
                      objectId: { type: [integer, 'null'] }
                      guestCategories:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name: { type: [string, 'null'] }
                            statisticalGroup: { type: string }
                            isCountedInOccupancy: { type: boolean }
                            sortOrder: { type: integer }
                      count: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /subsidiaries:
    get:
      tags: [Subsidiaries]
      operationId: listSubsidiaries
      summary: The configured branches
      description: |
        Requires the `subsidiaries:read` scope.

        Master data only. `openingHours` and the check-in times are what an operator
        entered under Settings → Branches; whether a branch is open at the moment of the
        call is not computed, as that depends on the caller's timezone.

        The check-in times state house policy. They are unrelated to a reservation's
        `arrivalTime`, which carries what one guest announced for their own stay.
      responses:
        '200':
          description: All branches, ordered by name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Subsidiary' }
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /openapi.yaml:
    get:
      tags: [Meta]
      operationId: getOpenApiSpec
      summary: This API description
      description: |
        Returns this OpenAPI document. Any valid token is accepted; no
        particular scope is required. Signed-in users can also download it from
        the "API access" section of their profile.
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Send the personal access token: `Authorization: Bearer fwb_...`'
    basicAuth:
      type: http
      scheme: basic
      description: >-
        Username of the token owner plus the personal access token as the
        password. Intended for clients that cannot send custom headers, such as
        calendar applications. The real login password is never accepted.

  parameters:
    OriginId:
      name: originId
      in: query
      description: >-
        Reservation origin the price rows are looked up for. Price rows are linked to
        origins, so different origins legitimately yield different prices. Defaults to
        the origin configured for online booking; when none is configured the parameter
        is required.
      schema: { type: integer }
    StartDate:
      name: start
      in: query
      description: 'Start date (YYYY-MM-DD). Default: today.'
      schema: { type: string, format: date }
    EndDate:
      name: end
      in: query
      description: 'End date (YYYY-MM-DD). Default: same as start.'
      schema: { type: string, format: date }
    StartMonth:
      name: start
      in: query
      description: 'First month (YYYY-MM). Default: current month.'
      schema: { type: string, pattern: '^\d{4}-\d{2}$', examples: ['2026-01'] }
    EndMonth:
      name: end
      in: query
      description: 'Last month (YYYY-MM). Default: same as start.'
      schema: { type: string, pattern: '^\d{4}-\d{2}$', examples: ['2026-12'] }
    ObjectId:
      name: objectId
      in: query
      description: 'Restrict to a single property/branch. Default: all.'
      schema: { type: integer }
    ReservationStatusId:
      name: statusId
      in: query
      description: >-
        Reservation status IDs, repeatable or comma-separated.
        Default: all blocking statuses.
      schema:
        oneOf:
          - type: string
          - type: array
            items: { type: integer }

  responses:
    BadRequest:
      description: Invalid parameters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            examples: ['Bearer realm="fewohbee-api", Basic realm="fewohbee-api"']
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The token lacks the required scope, or its owner lacks the role.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit exceeded (300 requests per 5 minutes per token).
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: integer }
            message: { type: string }
      examples:
        - error:
            code: 400
            message: "Invalid parameter 'start': expected format Y-m-d."

    Subsidiary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        openingHours:
          type: [object, 'null']
          description: >-
            Weekday ('1' = Monday … '7' = Sunday) to its time ranges, or null when no
            opening hours are configured at all. Within a configured set, a weekday that
            is absent is closed.
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                from: { type: string, examples: ['08:00'] }
                to: { type: string, examples: ['12:00'] }
        openingHoursNote:
          type: [string, 'null']
          description: >-
            Free text an operator entered alongside the hours, for anything a weekly grid
            cannot express. Null when none is set.
        checkInFrom:
          type: [string, 'null']
          description: >-
            Earliest time a guest can check in, as 'HH:MM'. House policy, unrelated to the
            arrivalTime of any single reservation, which is what one guest announced for
            their own stay. Null when the house publishes no check-in time.
          examples: ['17:00']
        checkInUntil:
          type: [string, 'null']
          description: >-
            End of the arrival window, as 'HH:MM'. Null means there is no published upper
            bound and arrivals after checkInFrom stay possible.
          examples: ['20:00']
        checkOutUntil:
          type: [string, 'null']
          description: >-
            Time by which the room has to be vacated on the day of departure, as 'HH:MM'.
            Null when the house publishes none.
          examples: ['10:00']
        checkInNote:
          type: [string, 'null']
          description: >-
            Free text alongside the check-in times, for the exception a pair of clock
            values cannot carry. Null when none is set.
      examples:
        - id: 1
          name: Main house
          description: Reception building
          openingHours:
            '1': [{ from: '08:00', to: '12:00' }, { from: '16:00', to: '19:00' }]
            '6': [{ from: '09:00', to: '12:00' }]
          openingHoursNote: Outside these hours by arrangement
          checkInFrom: '17:00'
          checkInUntil: '20:00'
          checkOutUntil: '10:00'
          checkInNote: Later arrival by arrangement

    Reservation:
      type: object
      properties:
        uuid: { type: [string, 'null'], format: uuid }
        bookingGroupUuid:
          type: [string, 'null']
          format: uuid
          description: Groups reservations that were booked together.
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        arrivalTime: { type: [string, 'null'], examples: ['15:00'] }
        departureTime: { type: [string, 'null'], examples: ['10:00'] }
        persons: { type: integer }
        guestCounts:
          type: object
          description: Number of guests per guest category ID.
          additionalProperties: { type: integer }
        status:
          type: object
          properties:
            id: { type: [integer, 'null'] }
            name: { type: [string, 'null'] }
        apartment:
          type: object
          properties:
            id: { type: [integer, 'null'] }
            number: { type: [string, 'null'] }
            description: { type: [string, 'null'] }
        object:
          type: object
          description: The property/branch the room belongs to.
          properties:
            id: { type: [integer, 'null'] }
            name: { type: [string, 'null'] }
        origin: { type: [string, 'null'], description: Booking origin/channel. }
        bookerName: { type: string }
        remark: { type: [string, 'null'] }
        optionDate: { type: [string, 'null'], format: date }
        reservationDate: { type: string, format: date-time }
        types:
          type: array
          items: { type: string, enum: [arrival, departure, inhouse] }
        isImported:
          type: boolean
          description: Whether the reservation came from a calendar import.
        invoices:
          type: [array, 'null']
          description: >-
            Linked invoices as metadata only. Filled only when the token also
            carries the `invoices:read` scope; `null` otherwise, so callers can
            tell "not permitted" apart from "no invoices" (`[]`).
          items: { $ref: '#/components/schemas/InvoiceRef' }

    InvoiceRef:
      type: object
      properties:
        id: { type: integer }
        number: { type: string }
        date: { type: string, format: date }
        status: { $ref: '#/components/schemas/InvoiceStatus' }

    InvoiceStatus:
      type: object
      properties:
        id: { type: integer, enum: [1, 2, 3, 4] }
        code:
          type: [string, 'null']
          enum: [OPEN, PAID, PREPAID, CANCELED, null]

    Invoice:
      type: object
      properties:
        id: { type: [integer, 'null'] }
        number: { type: [string, 'null'] }
        date: { type: string, format: date }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        paymentMeans:
          type: [object, 'null']
          description: UNTDID 4461 payment means code.
          properties:
            code: { type: integer, examples: [58] }
            name: { type: string, examples: [SEPA_CREDIT_TRANSFER] }
        payment: { type: [string, 'null'], description: Free-text payment note. }
        recipient:
          type: object
          properties:
            salutation: { type: [string, 'null'] }
            firstname: { type: [string, 'null'] }
            lastname: { type: [string, 'null'] }
            company: { type: [string, 'null'] }
            address: { type: [string, 'null'] }
            zip: { type: [string, 'null'] }
            city: { type: [string, 'null'] }
            country: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }
            buyerReference: { type: [string, 'null'] }
            buyerVatId: { type: [string, 'null'] }
        remark: { type: [string, 'null'] }
        totals:
          type: object
          description: 'gross = net + vat.'
          properties:
            gross: { type: number, format: float }
            net: { type: number, format: float }
            vat: { type: number, format: float }
        vatRates:
          type: array
          description: The same amounts broken down per VAT rate.
          items:
            type: object
            properties:
              rate: { type: number, format: float, examples: [19] }
              gross: { type: number, format: float }
              net: { type: number, format: float }
              vat: { type: number, format: float }
        apartments:
          type: array
          description: >-
            Accommodation lines - a snapshot of room, period and price at the
            time of invoicing.
          items:
            type: object
            properties:
              id: { type: integer }
              number: { type: [string, 'null'] }
              description: { type: [string, 'null'] }
              startDate: { type: string, format: date }
              endDate: { type: string, format: date }
              beds: { type: integer }
              persons: { type: integer }
              amount: { type: integer, description: Number of nights charged. }
              price: { type: number, format: float }
              vat: { type: number, format: float }
              includesVat: { type: boolean }
              isFlatPrice: { type: boolean }
              isPerRoom: { type: boolean }
              total: { type: number, format: float }
        positions:
          type: array
          description: All other invoice lines.
          items:
            type: object
            properties:
              id: { type: integer }
              description: { type: [string, 'null'] }
              amount: { type: integer }
              price: { type: number, format: float }
              vat: { type: number, format: float }
              includesVat: { type: boolean }
              isFlatPrice: { type: boolean }
              positionGroup: { type: [string, 'null'] }
              total: { type: number, format: float }
        reservations:
          type: array
          description: The reservations this invoice was created for.
          items:
            type: object
            properties:
              id: { type: integer }
              uuid: { type: [string, 'null'], format: uuid }

    Holiday:
      type: object
      properties:
        date: { type: string, format: date }
        name: { type: string }

    Calendar:
      type: object
      properties:
        id: { type: [integer, 'null'] }
        name: { type: string }
        color: { type: string, examples: ['#ffc107'] }
        requiresConfirmation:
          type: boolean
          description: Whether entries need a day-before confirmation.
        hasIcsSource: { type: boolean }
        lastSyncedAt: { type: [string, 'null'], format: date-time }

    CalendarEntry:
      type: object
      properties:
        id: { type: [integer, 'null'] }
        date: { type: string, format: date }
        title: { type: string }
        isManuallyCreated:
          type: boolean
          description: False when the entry came from an ICS sync.
        isConfirmed: { type: boolean }

    Price:
      type: object
      description: A configured price row. Reference data — see the endpoint description.
      properties:
        id: { type: integer }
        type: { type: string, enum: [apartment, misc] }
        description: { type: [string, 'null'] }
        price:
          type: number
          description: The stored amount. Per head, per room or for the whole stay depending on the flags below.
        vat: { type: number, description: 'VAT percentage.' }
        includesVat: { type: boolean, description: 'Whether `price` is gross.' }
        isFlatPrice: { type: boolean, description: 'Billed once for the stay.' }
        isPerRoom: { type: boolean, description: 'Billed per room-night, occupancy-independent.' }
        numberOfPersons:
          type: [integer, 'null']
          description: Occupancy this row is for. Matched exactly — there is no fallback to a lower occupancy.
        minStay: { type: [integer, 'null'] }
        active: { type: boolean }
        roomCategory:
          type: [object, 'null']
          properties:
            id: { type: [integer, 'null'] }
            name: { type: [string, 'null'] }
        origins:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: [string, 'null'] }
        allDays: { type: boolean, description: 'When true the weekday flags are ignored.' }
        weekdays:
          type: object
          description: Which weekdays the row applies to when `allDays` is false.
          properties:
            monday: { type: boolean }
            tuesday: { type: boolean }
            wednesday: { type: boolean }
            thursday: { type: boolean }
            friday: { type: boolean }
            saturday: { type: boolean }
            sunday: { type: boolean }
        allPeriods: { type: boolean, description: 'When true the row applies year-round and `periods` is irrelevant.' }
        periods:
          type: array
          description: Season windows the row applies to. Earlier-starting periods win over later ones.
          items:
            type: object
            properties:
              startDate: { type: string, format: date }
              endDate: { type: string, format: date }
        seasonStart: { type: [string, 'null'], format: date }
        seasonEnd: { type: [string, 'null'], format: date }
        isBookableOnline: { type: boolean }
        isMandatoryOnline: { type: boolean }
        isDefaultActiveInReservationCreation: { type: boolean }
        isPackage: { type: boolean, description: 'Whether the row splits into components for revenue accounting.' }
        components:
          type: array
          items:
            type: object
            properties:
              id: { type: [integer, 'null'] }
              description: { type: string }
              vat: { type: number }
              allocationType: { type: string }
              allocationValue: { type: [number, 'null'] }
              isRemainder: { type: boolean }
              sortOrder: { type: integer }

    Rate:
      type: object
      properties:
        occupancy: { type: integer }
        priceId: { type: integer }
        description: { type: [string, 'null'] }
        pricingModel: { type: string, enum: [per_person_night, per_room_night, flat] }
        unitPrice: { type: number, description: 'The stored amount of the price row.' }
        perNight:
          type: [number, 'null']
          description: >-
            Room total for one night at this occupancy. Null for `flat` rows — a flat
            price covers the whole stay and has no meaningful per-night figure.
        stayPrice:
          type: [number, 'null']
          description: The stay amount for `flat` rows; null otherwise.
        minStay: { type: [integer, 'null'] }
        vat: { type: number }
        includesVat: { type: boolean }
        isBookableOnline: { type: boolean }

    PriceQuote:
      type: object
      properties:
        apartment:
          type: object
          properties:
            id: { type: [integer, 'null'] }
            number: { type: [string, 'null'] }
            description: { type: [string, 'null'] }
        object:
          type: object
          properties:
            id: { type: [integer, 'null'] }
            name: { type: [string, 'null'] }
        roomCategory:
          type: [object, 'null']
          properties:
            id: { type: [integer, 'null'] }
            name: { type: [string, 'null'] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: 'Departure date, exclusive.' }
        nightCount: { type: integer }
        persons: { type: integer }
        guestCounts:
          type: object
          additionalProperties: { type: integer }
        origin:
          type: object
          properties:
            id: { type: integer }
            name: { type: [string, 'null'] }
        priceFound:
          type: boolean
          description: >-
            False when no price row applies. All totals are 0.0 then — do not read that
            as "free".
        room:
          type: object
          description: >-
            Room total. `gross`, `net` and `vat` are the VAT-resolved amounts. `base` and
            `modifiers` are the same total split into room rate and guest-category
            adjustments, but carried in the stored flavour of the price rows, so they add
            up to `gross` only where those rows are VAT-inclusive.
          properties:
            gross: { type: number }
            net: { type: number }
            vat: { type: number }
            base: { type: number, description: 'Room rate before guest-category adjustments, in the price row''s stored flavour.' }
            modifiers: { type: number, description: 'Sum of the guest-category adjustments, in the price row''s stored flavour.' }
        vatRates:
          type: array
          items:
            type: object
            properties:
              rate: { type: number }
              gross: { type: number }
              vat: { type: number }
              net: { type: number }
        nights:
          type: array
          description: >-
            One entry per stretch of nights sharing a price row, exactly as the invoice
            would print it — a stay crossing a season boundary yields two entries.
          items:
            type: object
            properties:
              startDate: { type: string, format: date }
              endDate: { type: string, format: date }
              nights: { type: integer, description: 'Night span of this stretch.' }
              description: { type: [string, 'null'] }
              unitPrice: { type: number }
              amount:
                type: integer
                description: 'Billed units — nights x persons for per-head rows, 1 for flat rows.'
              total: { type: number }
              vat: { type: number }
              includesVat: { type: boolean }
              isFlatPrice: { type: boolean }
              isPerRoom: { type: boolean }
              persons: { type: integer }
        modifiers:
          type: array
          description: >-
            Guest-category adjustments (child rates, extra-bed surcharges). Already part
            of the room total; listed separately so a consumer can explain why the quote
            differs from the room's list price.
          items:
            type: object
            properties:
              description: { type: [string, 'null'] }
              amount: { type: integer }
              unitPrice: { type: number }
              total: { type: number }
              vat: { type: number }
              includesVat: { type: boolean }
        extras:
          type: array
          description: >-
            Miscellaneous prices applicable to this stay, priced for a single room. Only
            those flagged `isMandatoryOnline` are summed into `extrasTotal`; the rest are
            listed so a caller can build its own basket.
          items:
            type: object
            properties:
              id: { type: integer }
              description: { type: [string, 'null'] }
              calculationType: { type: string, enum: [per_person_night, per_room_night, flat] }
              unitPrice: { type: number }
              validNights: { type: integer }
              total: { type: number }
              vat: { type: number }
              includesVat: { type: boolean }
              isBookableOnline: { type: boolean }
              isMandatoryOnline: { type: boolean }
              isDefaultActiveInReservationCreation: { type: boolean }
              roomCategory:
                type: [object, 'null']
                properties:
                  id: { type: [integer, 'null'] }
                  name: { type: [string, 'null'] }
        extrasTotal: { type: number, description: 'Sum of the mandatory extras.' }
        touristTax:
          type: [object, 'null']
          description: Null when the token lacks the `tourist-tax:read` scope.
          properties:
            total: { type: number }
            items:
              type: array
              items: { $ref: '#/components/schemas/TouristTaxItem' }
        grandTotal:
          type: [number, 'null']
          description: >-
            Room gross plus mandatory extras plus tourist tax. Null when the token lacks
            the `tourist-tax:read` scope, because the sum would be incomplete.

    TouristTaxItem:
      type: object
      properties:
        taxId: { type: integer }
        taxName: { type: string }
        calculationMode: { type: string, enum: [per_night_flat, percent_per_room] }
        guestCategory:
          type: [object, 'null']
          description: Null for percentage taxes, which are levied per room rather than per guest.
          properties:
            id: { type: integer }
            name: { type: string }
        reportGroup: { type: [string, 'null'] }
        pricePerNight: { type: number }
        nights: { type: integer }
        count: { type: integer }
        percentageRate: { type: [number, 'null'] }
        apartmentBase:
          type: [number, 'null']
          description: The apartment total the percentage was applied to.
        includesVat: { type: boolean }
        vatRate: { type: [number, 'null'] }
        total: { type: number }

    TouristTax:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        active: { type: boolean }
        calculationMode: { type: string, enum: [per_night_flat, percent_per_room] }
        percentageRate: { type: [number, 'null'] }
        percentageBase:
          type: [string, 'null']
          enum: [net, gross, null]
          description: Which apartment total a percentage tax is applied to.
        appliesOnlyToAdult: { type: boolean }
        includesVat: { type: boolean }
        validFrom: { type: [string, 'null'], format: date }
        validTo: { type: [string, 'null'], format: date }
        sortOrder: { type: integer }
        subsidiaries:
          type: array
          description: Empty means the tax applies to every subsidiary.
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: [string, 'null'] }
        taxRate:
          type: [object, 'null']
          properties:
            id: { type: integer }
            name: { type: string }
            rate: { type: number }
        rates:
          type: array
          description: Tariff per guest category. Empty for percentage taxes.
          items:
            type: object
            properties:
              guestCategory:
                type: object
                properties:
                  id: { type: [integer, 'null'] }
                  name: { type: [string, 'null'] }
              pricePerNight: { type: number }
              reportGroup: { type: [string, 'null'] }

    TouristTaxReportRow:
      type: object
      properties:
        taxId: { type: integer }
        name: { type: string }
        sortOrder: { type: integer }
        appliesOnlyToAdult: { type: boolean }
        calculationMode: { type: string, enum: [per_night_flat, percent_per_room] }
        percentageRate: { type: [number, 'null'] }
        percentageBase: { type: [string, 'null'] }
        totalNights: { type: integer, description: 'Guest-nights, i.e. nights x heads.' }
        totalAmount: { type: number }
        groups:
          type: array
          items:
            type: object
            properties:
              label: { type: [string, 'null'] }
              reportGroup: { type: [string, 'null'] }
              pricePerNight: { type: number }
              pricePerNightConsistent:

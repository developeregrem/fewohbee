guest_category:
  title: Κατηγορίες επισκεπτών
  description: Διαχείριση κατηγοριών επισκεπτών (π.χ. ενήλικες, παιδιά, μη 
    υπόχρεοι επισκέπτες)
  add: Προσθήκη κατηγορίας επισκέπτη
  delete:
    ask: Θέλετε σίγουρα να διαγράψετε αυτήν την κατηγορία επισκέπτη;
  system:
    locked: Οι κατηγορίες συστήματος δεν μπορούν να διαγραφούν.
  persons_total: Σύνολο ατόμων (πληρότητα)
  not_in_room_price: Δεν περιλαμβάνεται στην τιμή δωματίου
  not_in_room_price.help: Οι επισκέπτες αυτής της κατηγορίας δεν μετρούν στην 
    πληρότητα του δωματίου και δεν αποτελούν μέρος της τιμής του δωματίου — 
    εξαιρούνται αυτόματα από τη χρέωση διανυκτέρευσης. Ένας τροποποιητής τιμής 
    (π.χ. «δωρεάν») ούτε χρειάζεται ούτε έχει εδώ αποτέλεσμα.
  flag:
    adult: Ενήλικας
    occupancy: καταλαμβάνει κρεβάτι στο δωμάτιο
    no_occupancy: δεν καταλαμβάνει κρεβάτι στο δωμάτιο
  warning:
    no_adult: Αυτή η κράτηση δεν περιέχει ενήλικα επισκέπτη. Ενεργοποιήστε την 
      παρακάτω παράκαμψη για να αποθηκεύσετε παρ' όλα αυτά.
    over_capacity: Συμπληρώθηκε ο μέγιστος αριθμός ατόμων για το δωμάτιο.
  field:
    name: Όνομα
    acronym: Συντομογραφία
    acronym.help: Σύντομη ετικέτα, π.χ. ADT, C6-16, INF.
    statistical_group: Ομάδα
    statistical_group.help: Καθορίζει πώς αξιολογείται αυτή η κατηγορία. Οι 
      κατηγορίες της ομάδας «Ενήλικας» ικανοποιούν τον έλεγχο ότι μια κράτηση 
      κανονικά χρειάζεται τουλάχιστον έναν ενήλικα επισκέπτη.
    is_counted_in_occupancy: Μετράει ως κατειλημμένο κρεβάτι
    is_counted_in_occupancy.help: Ενεργοποιήστε το όταν οι επισκέπτες αυτής της 
      κατηγορίας καταλαμβάνουν κρεβάτι στο δωμάτιο. Αυτός ο αριθμός αφαιρείται 
      από τα διαθέσιμα κρεβάτια. Απενεργοποιήστε το, για παράδειγμα, για βρέφη 
      σε κούνια.
    min_age: Ελάχ. ηλικία
    max_age: Μέγ. ηλικία
    sort_order: Σειρά ταξινόμησης
    active: Ενεργή
    subsidiaries: Διαθέσιμη στα καταλύματα
    subsidiaries.help: Κενό = διαθέσιμη παντού.
    adult_rule_override: Να επιτραπεί αυτή η κράτηση χωρίς ενήλικα επισκέπτη
  statistical_group:
    adult: Ενήλικας
    child: Παιδί
    infant: Βρέφος
    other: Άλλο
  col:
    name: Όνομα
    acronym: Συντομογραφία
    statistical_group: Ομάδα
    flags: Ιδιότητες
    age: Ηλικία
    active: Ενεργή
    action: Ενέργεια
    count: Πλήθος
  flash:
    create:
      success: Η κατηγορία επισκέπτη δημιουργήθηκε.
    edit:
      success: Η κατηγορία επισκέπτη αποθηκεύτηκε.
    delete:
      success: Η κατηγορία επισκέπτη διαγράφηκε.
      error:
        system: Οι κατηγορίες συστήματος δεν μπορούν να διαγραφούν.
  default:
    adult:
      name: Ενήλικες
      acronym: ADT
    child:
      name: Παιδί 6–17
      acronym: C6-17
    infant:
      name: Βρέφος 0–5
      acronym: INF
    exempt:
      name: Μη υπόχρεοι επισκέπτες
      acronym: NL
guest_category_modifier:
  title: Προσαυξήσεις / εκπτώσεις ανά κατηγορία
  description: Ορίστε μια προσαύξηση, έκπτωση, κατ' αποκοπή τιμή ή «δωρεάν» ανά 
    κατηγορία επισκέπτη πάνω στην τιμή διανυκτέρευσης. Η τιμή ενήλικα παραμένει 
    η βασική τιμή. Οι τροποποιητές ισχύουν μόνο για τιμές διανυκτέρευσης που 
    υπολογίζονται ανά άτομο — όχι για κατ' αποκοπή τιμές ή τιμές ανά δωμάτιο.
  threshold_hint: Από ποια πληρότητα τίθενται σε ισχύ αυτοί οι τροποποιητές 
    (ελάχιστοι επισκέπτες με πλήρη τιμή) ρυθμίζεται ανά κατηγορία δωματίου — 
    π.χ. ώστε τα παιδιά να έχουν έκπτωση μόνο από 3 επισκέπτες και πάνω.
  add: Προσθήκη τροποποιητή
  empty: Δεν έχουν ρυθμιστεί ακόμη τροποποιητές — οι τιμές διανυκτέρευσης 
    ισχύουν αμετάβλητες για κάθε κατηγορία.
  delete:
    ask: Να διαγραφεί πράγματι αυτός ο τροποποιητής;
  type:
    surcharge_absolute: Προσαύξηση (ποσό)
    discount_percent: Έκπτωση (%)
    flat_rate: Κατ' αποκοπή τιμή ανά διανυκτέρευση
    free: Δωρεάν
  field:
    category: Κατηγορία επισκέπτη
    category.help: 'Εμφανίζονται μόνο κατηγορίες στις οποίες μπορεί να έχει αποτέλεσμα
      ένας τροποποιητής: όχι κατηγορίες ενηλίκων (αυτές αποτελούν τη βασική τιμή)
      και μόνο κατηγορίες που μετρούν στην πληρότητα του δωματίου. Οι επισκέπτες που
      δεν καταλαμβάνουν κρεβάτι (π.χ. βρέφη σε κούνια) δεν χρεώνονται μέσω της γραμμής
      δωματίου.'
    type: Τύπος τροποποιητή
    type.help: Η προσαύξηση προσθέτει ένα ποσό στην τιμή ενήλικα. Η έκπτωση 
      αφαιρεί ένα ποσοστό. Η κατ' αποκοπή τιμή αντικαθιστά την τιμή ενήλικα. 
      Δωρεάν = 0.00.
    value: Τιμή
    value.help: Ποσό στο ρυθμισμένο νόμισμα για προσαύξηση/κατ' αποκοπή τιμή, 
      ποσοστό για έκπτωση. Αγνοείται για το «Δωρεάν».
    valid_from: Ισχύει από
    valid_to: Ισχύει έως
    sort_order: Σειρά ταξινόμησης
    active: Ενεργός
  col:
    category: Κατηγορία επισκέπτη
    type: Τύπος
    value: Τιμή
    validity: Ισχύς
    active: Ενεργός
    action: Ενέργεια
  flash:
    create:
      success: Ο τροποποιητής δημιουργήθηκε.
    edit:
      success: Ο τροποποιητής αποθηκεύτηκε.
    delete:
      success: Ο τροποποιητής διαγράφηκε.

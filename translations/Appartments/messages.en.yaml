apartment:
  multiple:
    occupancy:
      hint: Guests from separate bookings can share the room during the same period. Only the number of people in each booking counts as occupied, remaining beds stay available for further bookings.
      text: Concurrent bookings allowed
appartment:
  active: Active
  active.hint: Inactive rooms are hidden from reservations, online booking and calendar synchronization.
  active.yes: Active
  active.no: Inactive
  action: Action
  bedsmax: Max. people
  bedsmin: Normal occupancy
  category: Room Category
  delete:
    ask: Are you sure you want to delete this room?
  description: Description
  flash:
    create:
      success: Room was successfully created .
    delete:
      error:
        still:
          in:
            use: Room cannot be deleted because it has already been booked.
      success: Room was successfully deleted.
    edit:
      success: Room was successfully processed.
  number: Room Number
  number.short: 'No.'
  object: Branch
calendar:
  sync:
    export:
      tab: Export
      access:
        last: Last retrieved
        never: Not retrieved yet
        public:
          hint: Allow other applications to access this calendar without signing in.
          label: Share calendar publicly
        title: Subscribe to the calendar
        url:
          hint: >-
            Subscribe using your calendar app or booking portal.
          title: Public calendar address
        private_url:
          hint: >-
            Works without public sharing. Use your username and an API token
            with the "Read calendars" permission as the password. Create the
            token in your profile.
          title: Private calendar address
      hint: >-
        Share this room's occupancy with calendar apps or booking portals via iCal.
      option:
        period:
          label: Period
          hint: >-
            Applies to reservations and room blocks. Current entries include departures today.
          current_future: Current and future entries
          all: Entire calendar
        guestname:
          hint: >-
            The title of the exported calendar entry contains the name of the
            guest.
          label: Export name of the guest
        times:
          label: Export arrival and departure times
          hint: >-
            Uses recorded arrival and departure times. A missing time is replaced
            with 00:00 in the export only; without recorded times, the entry remains
            an all-day event. Leave this option disabled for portals that expect all-day entries.
        status:
          label: Reservation status
          hint: Only reservations of the specified status will be exported.
        title: Export options
    import:
      tab: Import
      hint: Set up remote iCal calendars that should be imported for this room.
      list:
        title: Existing imports
        empty: No imports configured yet.
      create:
        title: Add import
        button: Add import
      name:
        label: Name
        hint: Display name shown in the reservation overview.
      url:
        label: URL
        hint: Remote iCal feed URL.
      active:
        label: active
        hint: Enables/disables this import.
      conflict:
        label: Conflict handling
        hint: Choose how overlapping reservations should be handled.
        option:
          skip: Skip conflicting entries
          overwrite: Overwrite existing reservation
          mark: Import and mark as conflict
      origin:
        label: Reservation origin
        hint: Origin assigned to imported reservations.
      status:
        label: Default status
        hint: Status assigned to imported reservations.
      last_sync:
        label: last synchronization
      last_error:
        label: last sync error
      delete:
        confirm: Delete this import configuration?
        title: Delete import
        hint: This import configuration will be removed permanently.
      actions:
        label: Actions
      edit:
        title: Edit import
      flash:
        create:
          success: Import configuration created.
        edit:
          success: Import configuration updated.
        delete:
          success: Import configuration deleted. Imported reservations were not deleted.
      preview:
        title: Check the calendar before importing
        hint: Portals sometimes include their own blocked periods or booking rules as well as reservations. This check shows which entries really are bookings.
        share:
          label: Use the same rules for all calendar imports from this portal
          hint: When enabled, this calendar import adopts existing rules for which entries count as bookings, even without checking the calendar first. Changes are shared with existing and future calendar imports from the same portal that also have this option enabled.
        button: Check calendar
        loading: Checking calendar
        configured: 'Saved exclusion rules: %count%. Checking the calendar again allows them to be compared with its current entries.'
        question: Which entries should be imported as bookings?
        labels_hint: The displayed labels come directly from the portal. The checkbox can be cleared for blocked periods or other entries that are not real bookings.
        labels_explanation: The portal gives each calendar entry a label, such as “Reserved” or “Not available”. FewohBee groups identical labels. The dates and count make them easier to identify.
        default_safety: All entries are enabled initially, so a real booking is not accidentally missed.
        count_title: Periods found
        similar:
          title: Exclude similar labels too
          hint: If a portal changes a label slightly, a shared part of the text can be entered.
          placeholder: e.g. Not available
          add: Add
          remove: Remove rule
        existing_hint: Existing imported reservations are not changed or deleted automatically.
        empty_summary: Without a label
        error:
          generic: The calendar could not be checked. Please try again.
          invalid_request: This request has expired. The window needs to be reopened.
          invalid_url: A valid calendar URL must be entered first.
        result:
          empty: The calendar is reachable but contains no current or future entries.
          success: 'Calendar checked: %count% current or future periods found.'
          success_with_skipped: 'Calendar checked: %count% current or future periods found; %skipped% unreadable entries were omitted.'
      error:
        http_status: Remote calendar returned an invalid response.
        unreachable: Remote calendar URL is not reachable.
        too_large: Remote calendar is larger than 2 MB.
        invalid_ical: Remote calendar is not a valid iCal feed.
        skipped:
          summary: >-
            Skipped events: missing required fields (%missing%), conflicts (%conflict%).
    title: Syncing your calendar

calendar:
  sync:
    export:
      tab: Εξαγωγή
      access:
        last: Τελευταία ανάκτηση
        never: Δεν έχει ανακτηθεί ακόμη
        public:
          hint: Επιτρέψτε σε άλλες εφαρμογές να έχουν πρόσβαση σε αυτό το 
            ημερολόγιο χωρίς σύνδεση.
          label: Δημόσια κοινοποίηση ημερολογίου
        title: Συνδρομή στο ημερολόγιο
        url:
          hint: Εγγραφείτε μέσω της εφαρμογής ημερολογίου ή της πύλης κρατήσεών 
            σας.
          title: Δημόσια διεύθυνση ημερολογίου
        private_url:
          hint: Λειτουργεί χωρίς δημόσια κοινοποίηση. Χρησιμοποιήστε το όνομα 
            χρήστη σας και ως κωδικό πρόσβασης ένα API token με το δικαίωμα 
            «Ανάγνωση ημερολογίων». Δημιουργήστε το token στο προφίλ σας.
          title: Ιδιωτική διεύθυνση ημερολογίου
      hint: Κοινοποιήστε την πληρότητα αυτού του δωματίου σε εφαρμογές 
        ημερολογίου ή πύλες κρατήσεων μέσω iCal.
      option:
        period:
          label: Περίοδος
          hint: Ισχύει για κρατήσεις και αποκλεισμούς δωματίων. Οι τρέχουσες 
            καταχωρίσεις περιλαμβάνουν και τις σημερινές αναχωρήσεις.
          current_future: Τρέχουσες και μελλοντικές καταχωρίσεις
          all: Ολόκληρο το ημερολόγιο
        guestname:
          hint: Ο τίτλος της εξαγόμενης καταχώρισης ημερολογίου περιέχει το 
            όνομα του επισκέπτη.
          label: Εξαγωγή ονόματος επισκέπτη
        times:
          label: Εξαγωγή ωρών άφιξης και αναχώρησης
          hint: Χρησιμοποιεί τις καταγεγραμμένες ώρες άφιξης και αναχώρησης. Μια
            ώρα που λείπει αντικαθίσταται με 00:00 μόνο στην εξαγωγή· χωρίς 
            καταγεγραμμένες ώρες, η καταχώριση παραμένει ολοήμερη. Αφήστε αυτήν 
            την επιλογή απενεργοποιημένη για πύλες που αναμένουν ολοήμερες 
            καταχωρίσεις.
        status:
          label: Κατάσταση κράτησης
          hint: Εξάγονται μόνο κρατήσεις με την καθορισμένη κατάσταση.
        title: Επιλογές εξαγωγής
    import:
      tab: Εισαγωγή
      hint: Ρυθμίστε απομακρυσμένα ημερολόγια iCal που πρέπει να εισάγονται για 
        αυτό το δωμάτιο.
      list:
        title: Υπάρχουσες εισαγωγές
        empty: Δεν έχουν ρυθμιστεί ακόμη εισαγωγές.
      create:
        title: Προσθήκη εισαγωγής
        button: Προσθήκη εισαγωγής
      name:
        label: Όνομα
        hint: Εμφανιζόμενο όνομα στην επισκόπηση κρατήσεων.
      url:
        label: URL
        hint: URL της απομακρυσμένης ροής iCal.
      active:
        label: ενεργή
        hint: Ενεργοποιεί/απενεργοποιεί αυτήν την εισαγωγή.
      conflict:
        label: Χειρισμός συγκρούσεων
        hint: Επιλέξτε πώς θα αντιμετωπίζονται οι επικαλυπτόμενες κρατήσεις.
        option:
          skip: Παράλειψη καταχωρίσεων σε σύγκρουση
          overwrite: Αντικατάσταση υπάρχουσας κράτησης
          mark: Εισαγωγή και σήμανση ως σύγκρουση
      origin:
        label: Προέλευση κράτησης
        hint: Προέλευση που ανατίθεται στις εισαγόμενες κρατήσεις.
      status:
        label: Προεπιλεγμένη κατάσταση
        hint: Κατάσταση που ανατίθεται στις εισαγόμενες κρατήσεις.
      last_sync:
        label: τελευταίος συγχρονισμός
      last_error:
        label: τελευταίο σφάλμα συγχρονισμού
      delete:
        confirm: Να διαγραφεί αυτή η διαμόρφωση εισαγωγής;
        title: Διαγραφή εισαγωγής
        hint: Αυτή η διαμόρφωση εισαγωγής θα αφαιρεθεί οριστικά.
      actions:
        label: Ενέργειες
      edit:
        title: Επεξεργασία εισαγωγής
      flash:
        create:
          success: Η διαμόρφωση εισαγωγής δημιουργήθηκε.
        edit:
          success: Η διαμόρφωση εισαγωγής ενημερώθηκε.
        delete:
          success: Η διαμόρφωση εισαγωγής διαγράφηκε. Οι εισαγόμενες κρατήσεις 
            δεν διαγράφηκαν.
      preview:
        title: Έλεγχος του ημερολογίου πριν από την εισαγωγή
        hint: Οι πύλες μερικές φορές περιλαμβάνουν, εκτός από τις κρατήσεις, και
          δικές τους αποκλεισμένες περιόδους ή κανόνες κρατήσεων. Αυτός ο 
          έλεγχος δείχνει ποιες καταχωρίσεις είναι πραγματικά κρατήσεις.
        share:
          label: Χρήση των ίδιων κανόνων για όλες τις εισαγωγές ημερολογίου από 
            αυτήν την πύλη
          hint: Όταν είναι ενεργοποιημένο, αυτή η εισαγωγή ημερολογίου υιοθετεί 
            τους υπάρχοντες κανόνες για το ποιες καταχωρίσεις μετρούν ως 
            κρατήσεις, ακόμη και χωρίς προηγούμενο έλεγχο του ημερολογίου. Οι 
            αλλαγές κοινοποιούνται σε υπάρχουσες και μελλοντικές εισαγωγές 
            ημερολογίου από την ίδια πύλη που έχουν επίσης ενεργοποιημένη αυτήν 
            την επιλογή.
        button: Έλεγχος ημερολογίου
        loading: Γίνεται έλεγχος ημερολογίου
        configured: 'Αποθηκευμένοι κανόνες εξαίρεσης: %count%. Ένας νέος έλεγχος του
          ημερολογίου επιτρέπει τη σύγκρισή τους με τις τρέχουσες καταχωρίσεις του.'
        question: Ποιες καταχωρίσεις πρέπει να εισαχθούν ως κρατήσεις;
        labels_hint: Οι εμφανιζόμενες ετικέτες προέρχονται απευθείας από την 
          πύλη. Το πλαίσιο ελέγχου μπορεί να αποεπιλεγεί για αποκλεισμένες 
          περιόδους ή άλλες καταχωρίσεις που δεν είναι πραγματικές κρατήσεις.
        labels_explanation: Η πύλη δίνει σε κάθε καταχώριση ημερολογίου μια 
          ετικέτα, όπως «Reserved» ή «Not available». Το FewohBee ομαδοποιεί τις
          ίδιες ετικέτες. Οι ημερομηνίες και το πλήθος διευκολύνουν την 
          αναγνώρισή τους.
        default_safety: Όλες οι καταχωρίσεις είναι αρχικά ενεργοποιημένες, ώστε 
          να μη χαθεί κατά λάθος κάποια πραγματική κράτηση.
        count_title: Περίοδοι που βρέθηκαν
        similar:
          title: Εξαίρεση και παρόμοιων ετικετών
          hint: Αν μια πύλη αλλάζει ελαφρώς μια ετικέτα, μπορεί να εισαχθεί ένα 
            κοινό τμήμα του κειμένου.
          placeholder: π.χ. Not available
          add: Προσθήκη
          remove: Αφαίρεση κανόνα
        existing_hint: Οι υπάρχουσες εισαγόμενες κρατήσεις δεν αλλάζουν ούτε 
          διαγράφονται αυτόματα.
        empty_summary: Χωρίς ετικέτα
        error:
          generic: Δεν ήταν δυνατός ο έλεγχος του ημερολογίου. Δοκιμάστε ξανά.
          invalid_request: Αυτό το αίτημα έχει λήξει. Το παράθυρο πρέπει να 
            ανοίξει ξανά.
          invalid_url: Πρέπει πρώτα να εισαχθεί ένα έγκυρο URL ημερολογίου.
        result:
          empty: Το ημερολόγιο είναι προσβάσιμο, αλλά δεν περιέχει τρέχουσες ή 
            μελλοντικές καταχωρίσεις.
          success: 'Το ημερολόγιο ελέγχθηκε: βρέθηκαν %count% τρέχουσες ή μελλοντικές
            περίοδοι.'
          success_with_skipped: 'Το ημερολόγιο ελέγχθηκε: βρέθηκαν %count% τρέχουσες
            ή μελλοντικές περίοδοι· παραλείφθηκαν %skipped% μη αναγνώσιμες καταχωρίσεις.'
      error:
        http_status: Το απομακρυσμένο ημερολόγιο επέστρεψε μη έγκυρη απόκριση.
        redirect: Το URL του απομακρυσμένου ημερολογίου ανακατευθύνει πάρα 
          πολλές φορές. Εισαγάγετε την άμεση διεύθυνση iCal.
        unreachable: Το URL του απομακρυσμένου ημερολογίου δεν είναι προσβάσιμο.
        too_large: Το απομακρυσμένο ημερολόγιο είναι μεγαλύτερο από 2 MB.
        invalid_ical: Το απομακρυσμένο ημερολόγιο δεν είναι έγκυρη ροή iCal.
        skipped:
          summary: 'Παραλειφθέντα γεγονότα: λείπουν υποχρεωτικά πεδία (%missing%),
            συγκρούσεις (%conflict%).'
    title: Συγχρονισμός του ημερολογίου σας

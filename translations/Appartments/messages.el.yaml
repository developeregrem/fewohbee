  action: Ενέργεια
  bedsmax: Μέγ. άτομα
  bedsmin: Κανονική πληρότητα
  category: Κατηγορία δωματίου
  category.missing: Δημιουργήστε μια κατηγορία δωματίου στις ρυθμίσεις πριν 
    προσθέσετε δωμάτιο.
  delete:
    ask: Θέλετε σίγουρα να διαγράψετε αυτό το δωμάτιο;
  description: Περιγραφή
  flash:
    create:
      success: Το δωμάτιο δημιουργήθηκε με επιτυχία.
    delete:
      error:
        still:
          in:
            use: Το δωμάτιο δεν μπορεί να διαγραφεί, επειδή έχει ήδη κρατηθεί.

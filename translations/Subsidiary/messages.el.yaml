object.opening_hours.help: Αφήστε το κενό για «κλειστό». Οι ώρες μπορούν να 
  εισαχθούν σε πρότυπα επιστολών και email με το απόσπασμα «Ώρες λειτουργίας του
  καταλύματος» και να ανακτηθούν μέσω του REST API.
object.opening_hours_note: Σημείωση για τις ώρες λειτουργίας
object.opening_hours_note.help: Ελεύθερο κείμενο που εκτυπώνεται μαζί με τις 
  ώρες — για όλα όσα δεν μπορεί να εκφράσει ένα εβδομαδιαίο πρόγραμμα.
object.opening_hours_note.placeholder: π.χ. εκτός αυτών των ωρών κατόπιν 
  συνεννόησης, τηλ. 0123 456

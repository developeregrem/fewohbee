tourist_tax:
  title: Φόρος διαμονής
  description: Ορισμοί φόρου διαμονής με εκδόσεις ανά κατάλυμα, με συντελεστές 
    ανά κατηγορία επισκέπτη.
  add: Προσθήκη φόρου διαμονής
  empty: Δεν υπάρχουν ακόμη ορισμοί φόρου διαμονής.
  delete:
    ask: Να διαγραφεί πράγματι αυτός ο ορισμός φόρου διαμονής;
  subsidiaries:
    global: Όλα τα καταλύματα
  field:
    name: Όνομα
    tax_rate: Συντελεστής ΦΠΑ
    tax_rate.help: Εμφανίζεται μόνο για το ενεργό προκαθορισμένο λογιστικό 
      σχέδιο ή για καταχωρίσεις χωρίς προκαθορισμό.
    revenue_account: Λογαριασμός εσόδων
    revenue_account.help: Προαιρετικό. Λογαριασμός για τα έσοδα από φόρο 
      διαμονής στο ημερολόγιο εγγραφών. Θα πρέπει να είναι ξεχωριστός 
      λογαριασμός, χωριστά από τα έσοδα διαμονής, ώστε οι φόροι διαμονής να 
      μπορούν να δηλώνονται και να αποδίδονται στον δήμο αυτοτελώς.<br><br> 
      Αφήστε το κενό για να χρησιμοποιηθεί ο προεπιλεγμένος λογαριασμός εσόδων 
      του επιλεγμένου συντελεστή ΦΠΑ.
    includes_vat: Μικτό (με ΦΠΑ)
    includes_vat.help: Αν είναι ενεργοποιημένο, ο συντελεστής αντιμετωπίζεται ως
      μικτό ποσό.
    applies_only_to_adult: Υπόχρεοι μόνο οι ενήλικες
    applies_only_to_adult.help: Π.χ. όπως ο ελβετικός φόρος καταλύματος — τα 
      παιδιά/βρέφη εξαιρούνται.
    valid_from: Ισχύει από
    valid_to: Ισχύει έως
    sort_order: Σειρά ταξινόμησης
    active: Ενεργό
    subsidiaries: Διαθέσιμο στα καταλύματα
    subsidiaries.help: Κενό = καθολικό. Οι φόροι που αφορούν συγκεκριμένα 
      καταλύματα εμφανίζονται μόλις συνδεθεί τουλάχιστον ένα κατάλυμα.
    rates: Συντελεστές ανά κατηγορία επισκέπτη
    calculation_mode: Υπολογισμός
    calculation_mode.help: Η κατ' αποκοπή μέθοδος χρησιμοποιεί τον παρακάτω 
      πίνακα ανά κατηγορία. Οι ποσοστιαίες μέθοδοι εφαρμόζονται στην τιμή 
      διανυκτέρευσης του δωματίου και αγνοούν τον πίνακα.
    percentage_rate: Ποσοστό
    percentage_rate.help: Μερίδιο της τιμής διανυκτέρευσης, π.χ. 5.00 για 5%.
    percentage_base: Βάση
    percentage_base.help: Καθαρή ή μικτή τιμή διανυκτέρευσης ως βάση υπολογισμού
      (σύμφωνα με τον δημοτικό κανονισμό).
  calculation_mode:
    per_night_flat: Κατ' αποκοπή ανά άτομο και διανυκτέρευση (π.χ. φόρος 
      διαμονής)
    percent_per_room: Ποσοστό της τιμής διανυκτέρευσης (π.χ. δημοτικός φόρος)
  percentage_base:
    net: Καθαρή τιμή διανυκτέρευσης
    gross: Μικτή τιμή διανυκτέρευσης
  rates:
    heading: Συντελεστές ανά κατηγορία επισκέπτη
    help: Εισαγάγετε τον συντελεστή ανά διανυκτέρευση για κάθε κατηγορία 
      επισκέπτη. Συντελεστής 0 με ομάδα αναφοράς χαρακτηρίζει απαλλασσόμενες 
      ομάδες. Ποσά στο ρυθμισμένο νόμισμα (%symbol%).
    add: Προσθήκη συντελεστή
    empty: Δεν υπάρχουν συντελεστές
  rate:
    field:
      category: Κατηγορία επισκέπτη
      price_per_night: Συντελεστής ανά διανυκτέρευση
      report_group: Ομάδα αναφοράς
      report_group.help: Προαιρετικό. Ελεύθερη ετικέτα (π.χ. «Ενήλικες», «Παιδιά
        6–16», «Απαλλασσόμενα άτομα») που χρησιμοποιείται ως όνομα γραμμής στην 
        επίσημη μηνιαία αναφορά. Οι συντελεστές με το ίδιο κείμενο ομάδας 
        αναφοράς συγχωνεύονται σε μία γραμμή αναφοράς — χρήσιμο για την 
        ομαδοποίηση φοιτητών, στρατιωτών και δωρεάν διαμονών σε μία γραμμή 
        «Απαλλασσόμενα άτομα». Αφήστε το κενό για να χρησιμοποιηθεί το όνομα της
        κατηγορίας.
  col:
    name: Όνομα
    subsidiaries: Κατάλυμα
    validity: Ισχύς
    applies_only_to_adult: Μόνο ενήλικες
    rates: Συντελεστές
    active: Ενεργό
    action: Ενέργεια
  flash:
    create:
      success: Ο ορισμός φόρου διαμονής δημιουργήθηκε.
    edit:
      success: Ο ορισμός φόρου διαμονής αποθηκεύτηκε.
    delete:
      success: Ο ορισμός φόρου διαμονής διαγράφηκε.

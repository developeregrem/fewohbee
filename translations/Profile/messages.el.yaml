profile:
  personal_data:
    title: Προσωπικά στοιχεία
    subtitle: Ενημερώστε τα προσωπικά σας στοιχεία εδώ.
    submit: Αποθήκευση αλλαγών
    saving: Αποθήκευση…
    updated: Τα στοιχεία σας ενημερώθηκαν.
    password_help: Αφήστε το κενό για να διατηρήσετε τον τρέχοντα κωδικό 
      πρόσβασής σας.
  theme:
    label: Λειτουργία χρωμάτων
    help: Επιλέξτε φωτεινή, σκοτεινή ή ακολουθήστε τη ρύθμιση του συστήματός 
      σας.
    auto: Αυτόματα (σύστημα)
    dark: Σκοτεινή
    light: Φωτεινή (προεπιλογή)
  apitokens:
    title: Πρόσβαση API
    subtitle: Δημιουργήστε προσωπικά tokens πρόσβασης για να ανακτάτε δεδομένα 
      μέσω του REST API ή εφαρμογών ημερολογίου.
    name: Όνομα
    token: Token
    created_at: Δημιουργήθηκε στις
    last_used: Τελευταία χρήση
    never: ποτέ
    actions: Ενέργειες
    none: Δεν υπάρχουν ακόμη API tokens.
    create: Δημιουργία API token
    submit: Δημιουργία
    created: Το API token δημιουργήθηκε.
    deleted: Το API token διαγράφηκε.
    created_once_hint: Το νέο σας token — εμφανίζεται μόνο μία φορά. Αντιγράψτε 
      το τώρα και φυλάξτε το με ασφάλεια.
    openapi: Λήψη περιγραφής API
    openapi_hint: — περιγράφει όλα τα endpoints και μπορεί να εισαχθεί σε 
      εργαλεία όπως το Postman ή το editor.swagger.io. Με token είναι επίσης 
      διαθέσιμη απευθείας στο /api/v1/openapi.yaml.
    copy: Αντιγραφή
    copied: Αντιγράφηκε!
    usage_hint: 'Χρήση: ως κεφαλίδα "Authorization: Bearer <token>" ή σε εφαρμογές
      ημερολογίου (π.χ. Thunderbird) ως κωδικός πρόσβασης μαζί με το όνομα χρήστη
      σας.'
    expiry:
      label: Λήξη
      never: απεριόριστη
      days30: 30 ημέρες
      days90: 90 ημέρες
      year1: 1 έτος
    scopes:
      label: Δικαιώματα
      min: Επιλέξτε τουλάχιστον ένα δικαίωμα.
      reservations_read: Κρατήσεις και διαθεσιμότητα
      calendar_read: Ημερολόγια (εξαγωγή iCal, αργίες, προσαρμοσμένα ημερολόγια)
      statistics_read: Στατιστικά και πρόβλεψη
      invoices_read: Τιμολόγια
      prices_read: Τιμές
      tourist_tax_read: Φόρος διαμονής
      subsidiaries_read: Καταλύματα (βασικά δεδομένα και ώρες λειτουργίας)
      availability_read: Διαθεσιμότητα (ελεύθερα και κρατημένα δωμάτια, χωρίς 
        δεδομένα κρατήσεων)
      mcp_access: Βοηθός AI (MCP)
      guests_read: Δεδομένα επισκεπτών (ονόματα, στοιχεία επικοινωνίας, 
        παρατηρήσεις)
      operations_read: Λειτουργία (πλάνο δωματίων, καθαριότητα)
      reservations_write: Δημιουργία κρατήσεων
      prices_write: Προσαρμογή τιμών
      bank_import_write: Προετοιμασία τραπεζικών κινήσεων
      receipts_submit: Υποβολή παραστατικών
    groups:
      see:
        rest: Τι μπορεί να διαβάζει αυτή η πρόσβαση;
        mcp: Τι μπορεί να βλέπει το AI;
      personal_data:
        rest: Ποια προσωπικά δεδομένα λαμβάνει αυτή η πρόσβαση;
        mcp: Ποια προσωπικά δεδομένα πηγαίνουν στο AI;
      change:
        rest: Τι μπορεί να αλλάζει αυτή η πρόσβαση;
        mcp: Τι μπορεί να αλλάζει το AI;
    hints:
      reservations_write: Μόνο μετά από προεπισκόπηση και τη συγκατάθεσή σας.
      prices_write: Οι υπάρχουσες κρατήσεις διατηρούν την τιμή τους. Ένα AI 
        αλλάζει τιμές μόνο μετά από προεπισκόπηση και τη συγκατάθεσή σας.
      bank_import_write: Κοινοποιεί στο AI ονόματα, αιτιολογίες και συντομευμένα
        IBAN των συναλλαγών. Την οριστική καταχώριση την κάνετε εσείς.
      receipts_submit: Το AI βλέπει μόνο λογαριασμούς και συντελεστές ΦΠΑ. Εσείς
        καταχωρίζετε τις προτάσεις αφού τις ελέγξετε.
    unavailable:
      role: Απαιτεί τον ρόλο «%role%».
    tools: 'Ξεκλειδώνει αυτά τα εργαλεία: %tools%'
    summary:
      and: και
      scope:
        reservations_read: κρατήσεις
        calendar_read: ημερολόγια
        statistics_read: στατιστικά
        invoices_read: τιμολόγια
        prices_read: τιμές
        tourist_tax_read: φόρο διαμονής
        subsidiaries_read: καταλύματα
        availability_read: διαθεσιμότητα
        operations_read: λειτουργία
        guests_read: δεδομένα επισκεπτών
        reservations_write: να δημιουργεί κρατήσεις
        prices_write: να προσαρμόζει τιμές
        bank_import_write: να προετοιμάζει τραπεζικές κινήσεις
        receipts_submit: να υποβάλλει παραστατικά
      see:
        rest: 'Αυτή η πρόσβαση μπορεί να διαβάζει: %list%.'
        mcp: 'Αυτό το AI μπορεί να διαβάζει: %list%.'
        mcp_none: Αυτό το AI δεν έχει πρόσθετα δικαιώματα ανάγνωσης.
      personal:
        none: Δεν λαμβάνει δεδομένα επισκεπτών.
        guests: Λαμβάνει δεδομένα επισκεπτών.
        bank: Λαμβάνει ονόματα και αιτιολογίες από τραπεζικές κινήσεις.
        both: Λαμβάνει δεδομένα επισκεπτών καθώς και ονόματα και αιτιολογίες από
          τραπεζικές κινήσεις.
      change:
        some: Μπορεί %list%.
        none: Δεν μπορεί να αλλάξει τίποτα.
        rest: Αυτή η πρόσβαση μπορεί %list%.
    kind:
      label: Χρήση
      api: REST API και προγράμματα ημερολογίου
      mcp: Βοηθός AI (MCP)
      mcp_badge: Βοηθός AI
      help: Μια πρόσβαση για βοηθό AI λειτουργεί μόνο με εργαλεία AI, όχι με το 
        REST API, και λήγει μετά την επιλεγμένη διάρκεια ισχύος. Το AI μπορεί να
        κάνει μόνο ό,τι επιλέξετε παρακάτω.
    mcp:
      privacy_hint: Ό,τι ανακτά ο βοηθός AI μεταβιβάζεται στον πάροχο AI (π.χ. 
        Anthropic ή OpenAI, ενδεχομένως εκτός ΕΕ). Χωρίς τα «Δεδομένα 
        επισκεπτών» το AI δεν λαμβάνει ονόματα, στοιχεία επικοινωνίας ή 
        παρατηρήσεις των επισκεπτών σας. Με την «Προετοιμασία τραπεζικών 
        κινήσεων», ωστόσο, βλέπει ονόματα, αιτιολογίες και συντομευμένα IBAN των
        τραπεζικών σας συναλλαγών, συχνά και πληρωμές επισκεπτών. Η κοινοποίηση 
        τέτοιων δεδομένων συνήθως απαιτεί σύμβαση επεξεργασίας δεδομένων με τον 
        πάροχο.
      write_disabled: Η επιλογή «Δημιουργία κρατήσεων» είναι απενεργοποιημένη 
        στις ρυθμίσεις για όλους τους χρήστες.
      write_disabled_link: Μετάβαση στις ρυθμίσεις
      expiry_required: Η πρόσβαση για βοηθούς AI χρειάζεται περιορισμένη 
        διάρκεια ισχύος.
      connect_hint: 'Σύνδεση βοηθών AI: εισαγάγετε αυτήν τη διεύθυνση στο εργαλείο
        AI σας ως διακομιστή MCP (τύπος HTTP) και περάστε το token μιας πρόσβασης
        AI ως κεφαλίδα "Authorization: Bearer <Token>".'
      endpoint: Διεύθυνση
      example: 'Παράδειγμα για το Claude Code:'
      more: Περισσότερα εργαλεία και λεπτομέρειες στο
      more_link: wiki
      usage_hint: 'Χρήση: εισαγάγετε τη διεύθυνση της διεπαφής (κάτω από τον πίνακα)
        στο εργαλείο AI σας και περάστε το token ως κεφαλίδα "Authorization: Bearer
        <Token>". Αυτή η πρόσβαση δεν λειτουργεί με το REST API.'
  passkeys:
    title: Σύνδεση χωρίς κωδικό πρόσβασης (Passkeys)
    create: Προσθήκη passkey
    device: Συσκευή
    created_at: Δημιουργήθηκε στις
    public_key: Δημόσιο κλειδί
    actions: Ενέργειες
    unknown: άγνωστο
    none: Δεν έχουν καταχωριστεί passkeys.
    delete: Το passkey διαγράφηκε με επιτυχία.
    error:
      already_registered: Αυτή η συσκευή είναι ήδη καταχωρισμένη ως passkey.
      registration_failed: Δεν ήταν δυνατή η δημιουργία του passkey.
      save_failed: Δεν ήταν δυνατή η αποθήκευση του passkey.
      unauthorized: Μη εξουσιοδοτημένη πρόσβαση.
      no_registration_in_progress: Δεν υπάρχει αυτήν τη στιγμή ενεργή καταχώριση
        passkey.
      invalid_response_type: Μη έγκυρη απόκριση εξουσιοδότησης.
  oidc:
    title: Ενιαία σύνδεση (SSO)
    linked: Ο λογαριασμός σας είναι συνδεδεμένος με τον πάροχο ενιαίας σύνδεσης.
    not_linked: Ο λογαριασμός σας δεν έχει συνδεθεί ακόμη. Η σύνδεση 
      δημιουργείται αυτόματα την πρώτη φορά που θα συνδεθείτε μέσω SSO.
    issuer: Πάροχος
    subject: Αναγνωριστικό
    linked_at: Συνδέθηκε στις

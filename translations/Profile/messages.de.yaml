profile:
  personal_data:
    title: Persönliche Daten
    subtitle: Passe deine persönlichen Daten an.
    submit: Speichern
    saving: Speichern...
    updated: Deine Daten wurden aktualisiert.
    password_help: Lasse das Feld leer, um dein aktuelles Passwort zu behalten.
  theme:
    label: Farbschema
    help: Wähle, ob das System hell, dunkel oder automatisch dargestellt wird.
    auto: Automatisch (System)
    dark: Dunkel
    light: Hell (Standard)
  apitokens:
    title: API-Zugänge
    subtitle: Erstelle persönliche Zugriffstokens, um Daten über die REST-API oder Kalender-Programme abzurufen.
    name: Bezeichnung
    token: Token
    created_at: Angelegt am
    last_used: Zuletzt genutzt
    never: nie
    actions: Aktionen
    none: Keine API-Zugänge vorhanden.
    create: API-Zugang anlegen
    submit: Anlegen
    created: Der API-Zugang wurde angelegt.
    deleted: Der API-Zugang wurde gelöscht.
    created_once_hint: Dein neues Token — es wird nur einmal angezeigt. Kopiere es jetzt und bewahre es sicher auf.
    openapi: API-Beschreibung herunterladen
    openapi_hint: >-
      — beschreibt alle Endpunkte und lässt sich z. B. in Postman oder
      editor.swagger.io importieren. Mit einem Token ist sie auch direkt unter
      /api/v1/openapi.yaml abrufbar.
    copy: Kopieren
    copied: Kopiert!
    usage_hint: 'Verwendung: als Header "Authorization: Bearer <Token>" oder in Kalender-Programmen (z. B. Thunderbird) als Passwort zusammen mit deinem Benutzernamen.'
    expiry:
      label: Gültigkeit
      never: unbegrenzt
      days30: 30 Tage
      days90: 90 Tage
      year1: 1 Jahr
    scopes:
      label: Berechtigungen
      min: Wähle mindestens eine Berechtigung aus.
      reservations_read: Reservierungen lesen
      calendar_read: Kalender lesen (iCal-Export, Feiertage, eigene Kalender)
      statistics_read: Statistiken lesen
      invoices_read: Rechnungen lesen
      prices_read: Preise lesen (Preisliste, Preisauskunft, Ratenkalender)
      tourist_tax_read: Kurtaxe lesen (Einstellungen und Monatsabrechnung)
      subsidiaries_read: Niederlassungen lesen (Stammdaten und Öffnungszeiten)
      mcp_access: KI-Assistent (MCP)
      guests_read: Gästedaten weitergeben (Namen, Kontaktdaten, Bemerkungen)
      reservations_write: Reservierungen anlegen
    kind:
      label: Verwendung
      api: REST-API und Kalender-Programme
      mcp: KI-Assistent (MCP)
      mcp_badge: KI-Assistent
      help: >-
        Ein Zugang für einen KI-Assistenten funktioniert nur mit KI-Programmen, nicht mit der REST-API, und
        läuft nach der gewählten Gültigkeit ab. Die KI darf nur lesen, was du unter „Berechtigungen“ auswählst.
    mcp:
      title: Zusätzlich für KI-Assistenten
      label: Zusätzliche Rechte für die KI
      privacy_hint: >-
        Alles, was der KI-Assistent abruft, wird an den Anbieter der KI übertragen (z. B. Anthropic oder
        OpenAI, ggf. außerhalb der EU). Ohne „Gästedaten weitergeben“ erhält die KI keine Namen, Kontaktdaten
        oder Bemerkungen. Für die Weitergabe von Gästedaten brauchst du in der Regel einen
        Auftragsverarbeitungsvertrag mit dem Anbieter.
      write_disabled: „Reservierungen anlegen“ ist in den Einstellungen für alle Benutzer abgeschaltet.
      write_disabled_link: Zu den Einstellungen
      expiry_required: Zugänge für KI-Assistenten brauchen eine begrenzte Gültigkeit.
      connect_hint: >-
        KI-Assistenten verbinden: Trage diese Adresse in deinem KI-Programm als MCP-Server (Typ HTTP) ein und gib
        das Token eines KI-Zugangs als Header „Authorization: Bearer <Token>“ mit.
      endpoint: Adresse
      example: 'Beispiel für Claude Code:'
      more: Weitere Programme und Details im
      more_link: Wiki
      usage_hint: >-
        Verwendung: Trage in deinem KI-Programm die Adresse der Schnittstelle (unter der Tabelle) ein und gib das
        Token als Header „Authorization: Bearer <Token>“ mit. Mit der REST-API funktioniert dieser Zugang nicht.
  passkeys:
    title: Passwortlose Anmeldung (Passkeys)
    create: Passkey anlegen
    device: Gerät
    created_at: Angelegt am
    public_key: Public Key
    actions: Aktionen
    unknown: unbekannt
    none: Keine Passkeys hinterlegt.
    delete: Passkey wurde erfolgreich gelöscht.
    error:
      already_registered: Dieses Gerät ist bereits als Passkey registriert.
      registration_failed: Der Passkey konnte nicht erstellt werden.
      save_failed: Der Passkey konnte nicht gespeichert werden.
      unauthorized: Nicht autorisiert.
      no_registration_in_progress: Es ist keine Passkey-Registrierung aktiv.
      invalid_response_type: Ungültige Antwort des Authenticators.
  oidc:
    title: Single Sign-On
    linked: Dein Konto ist mit dem Single-Sign-On-Anbieter verknüpft.
    not_linked: >-
      Dein Konto ist noch nicht verknüpft. Die Verknüpfung entsteht automatisch,
      sobald du dich das erste Mal über SSO anmeldest.
    issuer: Anbieter
    subject: Kennung
    linked_at: Verknüpft am

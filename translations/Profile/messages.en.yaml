profile:
  personal_data:
    title: Personal data
    subtitle: Update your personal details right here.
    submit: Save changes
    saving: Saving...
    updated: Your data has been updated.
    password_help: Leave empty to keep your current password.
  theme:
    label: Color mode
    help: Choose light, dark, or follow your system setting.
    auto: Auto (system)
    dark: Dark
    light: Light (default)
  apitokens:
    title: API access
    subtitle: Create personal access tokens to query data via the REST API or calendar applications.
    name: Name
    token: Token
    created_at: Created at
    last_used: Last used
    never: never
    actions: Actions
    none: No API tokens yet.
    create: Create API token
    submit: Create
    created: The API token has been created.
    deleted: The API token has been deleted.
    created_once_hint: Your new token — it is shown only once. Copy it now and store it securely.
    openapi: Download API description
    openapi_hint: >-
      — describes all endpoints and can be imported into tools such as Postman
      or editor.swagger.io. With a token it is also available directly at
      /api/v1/openapi.yaml.
    copy: Copy
    copied: Copied!
    usage_hint: 'Usage: as header "Authorization: Bearer <token>" or in calendar applications (e.g. Thunderbird) as the password together with your username.'
    expiry:
      label: Expiry
      never: unlimited
      days30: 30 days
      days90: 90 days
      year1: 1 year
    scopes:
      label: Permissions
      min: Select at least one permission.
      reservations_read: Read reservations
      calendar_read: Read calendars (iCal export, holidays, custom calendars)
      statistics_read: Read statistics
      invoices_read: Read invoices
      prices_read: Read prices (price list, price quote, rate calendar)
      tourist_tax_read: Read tourist tax (settings and monthly report)
      subsidiaries_read: Read branches (master data and opening hours)
      mcp_access: AI assistant (MCP)
      guests_read: Share guest data (names, contact details, remarks)
      reservations_write: Create reservations
    kind:
      label: Use
      api: REST API and calendar clients
      mcp: AI assistant (MCP)
      mcp_badge: AI assistant
      help: >-
        An access for an AI assistant only works with AI tools, not with the REST API, and expires after the
        chosen validity. The AI may only read what you select under "Permissions".
    mcp:
      title: Additionally for AI assistants
      label: Additional permissions for the AI
      privacy_hint: >-
        Everything the AI assistant retrieves is transferred to the AI provider (e.g. Anthropic or OpenAI,
        possibly outside the EU). Without "Share guest data" the AI receives no names, contact details or
        remarks. Sharing guest data usually requires a data processing agreement with the provider.
      write_disabled: '"Create reservations" is switched off in the settings for all users.'
      write_disabled_link: Go to settings
      expiry_required: Access for AI assistants needs a limited validity.
      connect_hint: >-
        Connect AI assistants: enter this address in your AI tool as an MCP server (type HTTP) and pass the token of
        an AI access as header "Authorization: Bearer <Token>".
      endpoint: Address
      example: 'Example for Claude Code:'
      more: Further tools and details in the
      more_link: wiki
      usage_hint: >-
        Usage: enter the interface address (below the table) in your AI tool and pass the token as header
        "Authorization: Bearer <Token>". This access does not work with the REST API.
  passkeys:
    title: Passwordless sign-in (Passkeys)
    create: Add passkey
    device: Device
    created_at: Created at
    public_key: Public key
    actions: Actions
    unknown: unknown
    none: No passkeys registered.
    delete: Passkey was successfully deleted.
    error:
      already_registered: This device is already registered as a passkey.
      registration_failed: The passkey could not be created.
      save_failed: The passkey could not be saved.
      unauthorized: Unauthorized.
      no_registration_in_progress: No passkey registration is currently active.
      invalid_response_type: Invalid authenticator response.
  oidc:
    title: Single sign-on
    linked: Your account is linked to the single sign-on provider.
    not_linked: >-
      Your account is not linked yet. The link is created automatically the first
      time you sign in via SSO.
    issuer: Provider
    subject: Identifier
    linked_at: Linked on

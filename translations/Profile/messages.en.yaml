profile:
  personal_data:
    title: Personal data
    subtitle: Update your personal details right here.
    submit: Save changes
    saving: Saving...
    updated: Your data has been updated.
    password_help: Leave empty to keep your current password.
  theme:
    label: Color mode
    help: Choose light, dark, or follow your system setting.
    auto: Auto (system)
    dark: Dark
    light: Light (default)
  apitokens:
    title: API access
    subtitle: Create personal access tokens to query data via the REST API or calendar applications.
    name: Name
    token: Token
    created_at: Created at
    last_used: Last used
    never: never
    actions: Actions
    none: No API tokens yet.
    create: Create API token
    submit: Create
    created: The API token has been created.
    deleted: The API token has been deleted.
    created_once_hint: Your new token — it is shown only once. Copy it now and store it securely.
    openapi: Download API description
    openapi_hint: >-
      — describes all endpoints and can be imported into tools such as Postman
      or editor.swagger.io. With a token it is also available directly at
      /api/v1/openapi.yaml.
    copy: Copy
    copied: Copied!
    usage_hint: 'Usage: as header "Authorization: Bearer <token>" or in calendar applications (e.g. Thunderbird) as the password together with your username.'
    expiry:
      label: Expiry
      never: unlimited
      days30: 30 days
      days90: 90 days
      year1: 1 year
    scopes:
      label: Permissions
      min: Select at least one permission.
      reservations_read: Reservations and availability
      calendar_read: Calendars (iCal export, holidays, custom calendars)
      statistics_read: Statistics and forecast
      invoices_read: Invoices
      prices_read: Prices
      tourist_tax_read: Tourist tax
      subsidiaries_read: Branches (master data and opening hours)
      availability_read: Availability (free and booked rooms, no reservation data)
      mcp_access: AI assistant (MCP)
      guests_read: Guest data (names, contact details, remarks)
      operations_read: Operations (room plan, housekeeping)
      reservations_write: Create reservations
      prices_write: Adjust prices
      bank_import_write: Prepare bank statements
    groups:
      see:
        rest: What may this access read?
        mcp: What may the AI see?
      personal_data:
        rest: Which personal data does this access receive?
        mcp: Which personal data goes to the AI?
      change:
        rest: What may this access change?
        mcp: What may the AI change?
    hints:
      reservations_write: Only after a preview and your consent.
      prices_write: Existing bookings keep their price. An AI only changes prices after a preview and your consent.
      bank_import_write: Shares names, purposes and shortened IBANs of the transactions with the AI. You commit them yourself.
    unavailable:
      role: Needs the role "%role%".
    tools: 'Unlocks these tools: %tools%'
    summary:
      and: and
      scope:
        reservations_read: reservations
        calendar_read: calendars
        statistics_read: statistics
        invoices_read: invoices
        prices_read: prices
        tourist_tax_read: tourist tax
        subsidiaries_read: branches
        availability_read: availability
        operations_read: operations
        guests_read: guest data
        reservations_write: create reservations
        prices_write: adjust prices
        bank_import_write: prepare bank statements
      see:
        rest: This access may read %list%.
        mcp: This AI may read %list%.
        mcp_none: This AI may not read anything.
      personal:
        none: It receives no guest data.
        guests: It receives guest data.
        bank: It receives names and purposes from bank statements.
        both: It receives guest data as well as names and purposes from bank statements.
      change:
        some: It may %list%.
        none: It cannot change anything.
        rest: This access may %list%.
    kind:
      label: Use
      api: REST API and calendar clients
      mcp: AI assistant (MCP)
      mcp_badge: AI assistant
      help: >-
        An access for an AI assistant only works with AI tools, not with the REST API, and expires after the
        chosen validity. The AI may only do what you select below.
    mcp:
      privacy_hint: >-
        Everything the AI assistant retrieves is transferred to the AI provider (e.g. Anthropic or OpenAI,
        possibly outside the EU). Without "Guest data" the AI receives no names, contact details or
        remarks of your guests. With "Prepare bank statements", however, it sees names, purposes and shortened
        IBANs of your bank transactions, often including payments by guests. Sharing such data usually
        requires a data processing agreement with the provider.
      write_disabled: '"Create reservations" is switched off in the settings for all users.'
      write_disabled_link: Go to settings
      expiry_required: Access for AI assistants needs a limited validity.
      connect_hint: >-
        Connect AI assistants: enter this address in your AI tool as an MCP server (type HTTP) and pass the token of
        an AI access as header "Authorization: Bearer <Token>".
      endpoint: Address
      example: 'Example for Claude Code:'
      more: Further tools and details in the
      more_link: wiki
      usage_hint: >-
        Usage: enter the interface address (below the table) in your AI tool and pass the token as header
        "Authorization: Bearer <Token>". This access does not work with the REST API.
  passkeys:
    title: Passwordless sign-in (Passkeys)
    create: Add passkey
    device: Device
    created_at: Created at
    public_key: Public key
    actions: Actions
    unknown: unknown
    none: No passkeys registered.
    delete: Passkey was successfully deleted.
    error:
      already_registered: This device is already registered as a passkey.
      registration_failed: The passkey could not be created.
      save_failed: The passkey could not be saved.
      unauthorized: Unauthorized.
      no_registration_in_progress: No passkey registration is currently active.
      invalid_response_type: Invalid authenticator response.
  oidc:
    title: Single sign-on
    linked: Your account is linked to the single sign-on provider.
    not_linked: >-
      Your account is not linked yet. The link is created automatically the first
      time you sign in via SSO.
    issuer: Provider
    subject: Identifier
    linked_at: Linked on

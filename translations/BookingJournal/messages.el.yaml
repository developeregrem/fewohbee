  παρατήρηση στο ημερολόγιο εγγραφών. Χωρίζονται σε κύρια υπηρεσία (γραμμές 
  δωματίων/κύριες γραμμές) και διάφορες υπηρεσίες. Ίδιος λογαριασμός + ΦΠΑ 
  ομαδοποιούνται ανά ενότητα· η ετικέτα συνδυάζεται με το όνομα του λογαριασμού 
  ως παρατήρηση (π.χ. <b>"Διαμονή – Έσοδα 7%"</b>). Όταν είναι κενή, γράφεται 
  μόνο το όνομα του λογαριασμού.

accounting.settings.remark_labels.intro: Αυτές οι ετικέτες χρησιμοποιούνται μόνο
  από ενέργειες αυτοματισμών (π.χ. αυτόματες λογιστικές εγγραφές κατά την 
  πληρωμή τιμολογίων).

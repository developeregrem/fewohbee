booking_rules:
  section_rules: Κανόνες κρατήσεων
  section_rules_desc: Ορίστε πόσο πρέπει να διαμείνουν οι επισκέπτες και ποιες 
    ημέρες δεν είναι δυνατή η άφιξη ή η αναχώρηση. Χωρίς κανόνα αρκεί μία 
    διανυκτέρευση.
  section_periods: Ειδικές περίοδοι
  section_periods_desc: Διαφορετικοί κανόνες για ένα εύρος ημερομηνιών, για 
    παράδειγμα αργίες ή υψηλή περίοδο. Τις ημέρες που καλύπτουν αντικαθιστούν 
    πλήρως τις ελάχιστες διαμονές των γενικών κανόνων — ακόμη και με χαμηλότερη 
    τιμή. Οι απαγορεύσεις άφιξης και αναχώρησης παραμένουν σε ισχύ.
  section_calendar: Ημερολόγιο
  section_calendar_desc: Τι ισχύει κάθε ημέρα. Η πάνω γραμμή συνδυάζει όλους 
    τους κανόνες, η επεξήγηση εξηγεί τις επισημασμένες τιμές. Κάντε κλικ σε έναν
    κανόνα για να επισημάνετε τις ημέρες του.
  add_rule: Προσθήκη κανόνα
  add_period: Προσθήκη ειδικής περιόδου
  no_rules: Δεν υπάρχει ακόμη κανόνας. Οι επισκέπτες μπορούν να κάνουν κράτηση 
    για οποιαδήποτε διάρκεια διαμονής.
  no_periods: Δεν υπάρχουν ακόμη ειδικές περίοδοι.
  periods_all_past: Όλες οι ειδικές περίοδοι βρίσκονται στο παρελθόν. Δεν 
    επηρεάζουν πλέον μελλοντικές κρατήσεις — προσαρμόστε τα εύρη ημερομηνιών αν 
    πρέπει να εξακολουθούν να ισχύουν.
  periods_all_past_link: Μετάβαση στις ειδικές περιόδους
  no_categories: Δεν έχει ανατεθεί πλέον καμία κατηγορία δωματίου — αυτός ο 
    κανόνας δεν έχει αποτέλεσμα.
  type: Τι πρέπει να ισχύει;
  type_min_stay_arrival: Ελάχιστη διαμονή κατά την άφιξη
  type_help_min_stay_arrival: Αν ένας επισκέπτης φτάνει σε μία από τις 
    επιλεγμένες ημέρες, η κράτηση πρέπει να φτάνει το ελάχιστο. Η ημέρα 
    αναχώρησης δεν παίζει ρόλο.
  type_min_stay_through: Ελάχιστη διαμονή για μια διανυκτέρευση
  type_help_min_stay_through: Αν μια κράτηση καλύπτει μία από τις επιλεγμένες 
    διανυκτερεύσεις, η κράτηση συνολικά πρέπει να φτάνει το ελάχιστο — δεν 
    χρειάζεται να περιλαμβάνει πολλές από αυτές τις διανυκτερεύσεις. Το Δευ → 
    Τρί σημαίνει τη διανυκτέρευση από Δευτέρα σε Τρίτη.
  type_closed_to_arrival: Δεν είναι δυνατή η άφιξη
  type_help_closed_to_arrival: Καμία διαμονή δεν μπορεί να ξεκινά τις 
    επιλεγμένες ημέρες.
  type_closed_to_departure: Δεν είναι δυνατή η αναχώρηση
  type_help_closed_to_departure: Καμία διαμονή δεν μπορεί να τελειώνει τις 
    επιλεγμένες ημέρες.

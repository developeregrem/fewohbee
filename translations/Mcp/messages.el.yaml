mcp:
  nav:
    label: Βοηθοί AI
  settings:
    page_title: Βοηθοί AI (MCP)
    intro: Συνδέστε βοηθούς τεχνητής νοημοσύνης όπως το Claude, εργαλεία συμβατά
      με το ChatGPT ή το n8n απευθείας με το FewohBee. Μπορούν τότε να 
      δημιουργούν αναλύσεις, να ελέγχουν τη διαθεσιμότητα και – αν το επιτρέψετε
      – να δημιουργούν κρατήσεις. Κάθε πρόσβαση έχει ακριβώς τα δικαιώματα που 
      της παραχωρείτε κατά τη δημιουργία της.
    section:
      access: Ρυθμίσεις για όλους τους χρήστες
      access_desc: Αυτοί οι διακόπτες ισχύουν για ολόκληρη την εγκατάσταση. Τι 
        μπορεί να διαβάζει και να κάνει μια μεμονωμένη πρόσβαση AI το επιλέγει 
        κάθε χρήστης κατά τη δημιουργία της πρόσβασής του στο προφίλ – αλλά ποτέ
        περισσότερα από όσα επιτρέπονται εδώ.
      users: Προσβάσεις χρηστών
      tokens: Ενεργές προσβάσεις AI
      log: Πρόσφατες ενέργειες
    enabled:
      label: Να επιτρέπονται βοηθοί AI
      help: Ενεργοποιεί ή απενεργοποιεί τη διεπαφή για όλους τους χρήστες. Οι 
        υπάρχουσες προσβάσεις AI λειτουργούν μόνο όσο αυτός ο διακόπτης είναι 
        ενεργός.
    write_enabled:
      label: Οι βοηθοί AI μπορούν να δημιουργούν κρατήσεις
      help: Όταν είναι απενεργοποιημένο, καμία πρόσβαση AI δεν μπορεί να 
        δημιουργεί κρατήσεις. Όταν είναι ενεργοποιημένο, κάθε χρήστης αποφασίζει
        κατά τη δημιουργία της πρόσβασής του αν το AI μπορεί να δημιουργεί 
        κρατήσεις. Κάθε κράτηση που δημιουργείται από βοηθό AI εμφανίζεται στο 
        παράθυρο ειδοποιήσεων.
    allowed_hosts:
      label: Διευθύνσεις αυτής της εγκατάστασης FewohBee
      help: Τα ονόματα κεντρικού υπολογιστή (host) στα οποία είναι προσβάσιμο το
        FewohBee σας – ένα ανά γραμμή, π.χ. fewohbee.example.com από το 
        https://fewohbee.example.com/mcp. Όχι η διεύθυνση του εργαλείου AI. Τα 
        αιτήματα για άλλα ονόματα host απορρίπτονται. Το localhost επιτρέπεται 
        πάντα.
      invalid: 'Μη έγκυρα ονόματα host: %hosts%'
    privacy_hint: Ό,τι ανακτά ένας βοηθός AI μεταβιβάζεται στον πάροχο AI. Τα 
      δεδομένα επισκεπτών (ονόματα, στοιχεία επικοινωνίας, παρατηρήσεις) 
      αποστέλλονται στο AI μόνο όταν μια πρόσβαση έχει το δικαίωμα «Κοινοποίηση 
      δεδομένων επισκεπτών». Ελέγξτε εκ των προτέρων αν χρειάζεστε σύμβαση 
      επεξεργασίας δεδομένων με τον πάροχο.
    connection:
      host_not_allowed: Η διεπαφή δεν είναι προσβάσιμη σε αυτήν τη διεύθυνση 
        (%host%). Προσθέστε το όνομα host παρακάτω στις «Διευθύνσεις αυτής της 
        εγκατάστασης FewohBee» και αποθηκεύστε.
      https_required: Η διεπαφή λειτουργεί μόνο μέσω HTTPS (κρυπτογραφημένα), 
        επειδή η πρόσβαση αποστέλλεται με κάθε αίτημα. Ρυθμίστε ένα έγκυρο 
        πιστοποιητικό.
      insecure_allowed: Η διεπαφή είναι ενεργοποιημένη χωρίς κρυπτογράφηση 
        (HTTP). Χρησιμοποιήστε το μόνο σε αξιόπιστο τοπικό δίκτυο.
    users:
      text: Κάθε χρήστης δημιουργεί τη δική του πρόσβαση στο προφίλ του, στην 
        ενότητα «Πρόσβαση API», και επιλέγει «Βοηθός AI (MCP)» ως χρήση της. 
        Εκεί αποφασίζει τι μπορεί να διαβάζει και να κάνει το AI – εντός του 
        ρόλου του και των παραπάνω διακοπτών. Εκεί βρίσκει επίσης τη διεύθυνση 
        της διεπαφής και παραδείγματα ρύθμισης.
      link: Δημιουργήστε τη δική σας πρόσβαση στο προφίλ
    tokens:
      desc: Όλες οι προσβάσεις με δικαίωμα για βοηθούς AI, όλων των χρηστών.
      user: Χρήστης
      none: Δεν υπάρχουν ακόμη προσβάσεις για βοηθούς AI.
      revoke: Ανάκληση πρόσβασης
      revoke_ask: Να ανακληθεί η πρόσβαση;
      revoked: Η πρόσβαση ανακλήθηκε.
    log:
      desc: Όλες οι κλήσεις από βοηθούς AI, οι νεότερες πρώτες. Οι καταχωρίσεις 
        διαγράφονται μετά από 90 ημέρες.
      date: Ώρα
      tool: Ενέργεια
      outcome: Αποτέλεσμα
      details: Λεπτομέρειες
      reservation: 'Κράτηση #%id%'
      price: 'Τιμή #%id%'
      none: Δεν υπάρχουν ακόμη κλήσεις.
      outcomes:
        ok: επιτυχής
        denied: απορρίφθηκε
        invalid: μη έγκυρη
        rate_limited: συμπληρώθηκε το όριο
        error: σφάλμα
    flash:
      saved: Οι ρυθμίσεις αποθηκεύτηκαν.

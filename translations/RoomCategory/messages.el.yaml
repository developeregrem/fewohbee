  min_full_payers: Ελάχιστοι επισκέπτες με πλήρη τιμή
  min_full_payers.help: 'Αριθμός επισκεπτών που πληρώνουν πάντα την πλήρη τιμή ανά
    άτομο πριν τεθούν σε ισχύ οι προσαρμογές τιμής ανά κατηγορία (π.χ. εκπτώσεις για
    παιδιά). Παράδειγμα: 2 → οι εκπτώσεις ισχύουν μόνο από 3 επισκέπτες και πάνω.
    0 = χωρίς ελάχιστο.'
  kind: Είδος δωματίου
  kind.accommodation: Διαμονή
  kind.accommodation.help: 'Για δωμάτια και ενοικιαζόμενα διαμερίσματα: κρατούνται
    ανά διανυκτέρευση και μετρούν στην πληρότητα, στις διανυκτερεύσεις και στον φόρο
    διαμονής.'
  kind.event_space: Χώρος εκδηλώσεων
  kind.event_space.help: 'Για αίθουσα σεμιναρίων, αίθουσα εκδηλώσεων ή υπαίθριο χώρο:
    κρατείται ανά ημέρα, δεν μετράει στην πληρότητα, στις διανυκτερεύσεις και στον
    φόρο διαμονής και δεν μπορεί ακόμη να κρατηθεί online. Τα έσοδά του μετρούν.'
  kind.has_reservations: Αυτή η κατηγορία έχει ήδη κρατήσεις. Αν αλλάξετε το 
    είδος δωματίου, τα στατιστικά, ο φόρος διαμονής και τα νέα τιμολόγια θα 
    ακολουθήσουν την αλλαγή.
  kind.error.mixed_prices: 'Το είδος δωματίου δεν μπορεί να αλλάξει όσο η κατηγορία
    μοιράζεται τιμές με κατηγορίες του άλλου είδους: %prices%. Αναθέστε πρώτα αυτές
    τις τιμές ξεχωριστά.'
  double: Δίκλινο δωμάτιο
  flash:

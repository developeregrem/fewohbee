    theme_background_use: Προσαρμοσμένο χρώμα
    theme_background: Χρώμα φόντου
    theme_background_help: Επιλέξτε ένα προσαρμοσμένο χρώμα – διαφορετικά το 
      φόντο παραμένει διαφανές, ώστε μια ενσωματωμένη σελίδα να αφήνει να 
      φαίνεται ο σχεδιασμός του δικού σας ιστότοπου.
    theme: Σχεδιασμός
    theme_help: Καθορίζει την εμφάνιση της δημόσιας σελίδας κρατήσεων. Το 
      προσαρμοσμένο CSS συνεχίζει να λειτουργεί και στους δύο σχεδιασμούς.
    theme_classic: Κλασικός
    theme_classic_help: Συμπαγής, απλή διάταξη – δείχνει πολλά σε λίγο χώρο.
    theme_modern: Μοντέρνος
    theme_modern_help: Ευρύχωρη διάταξη με μεγάλες εικόνες και σαφή καθοδήγηση 
      βημάτων.
    theme_preview: Άνοιγμα προεπισκόπησης
    mode: Πώς ξεκινούν οι επισκέπτες
    mode_help: Καθορίζει πώς επιλέγουν οι επισκέπτες τη διαμονή τους στη δημόσια
      σελίδα κρατήσεων.
    mode_search: Αναζήτηση
    mode_search_help: Οι επισκέπτες εισάγουν περίοδο, αριθμό ατόμων και αριθμό 
      δωματίων και επιλέγουν από τους κατάλληλους τύπους δωματίων. Η σωστή 
      επιλογή μόλις μπορεί να κρατηθεί περισσότερα από ένα δωμάτιο.
    mode_calendar: Ημερολόγιο
    mode_calendar_help: Οι επισκέπτες βλέπουν την πληρότητα ενός καταλύματος και
      επιλέγουν τη διαμονή τους απευθείας στο ημερολόγιο. Συνιστάται για 
      μεμονωμένα καταλύματα. Απαιτεί τον σχεδιασμό «Μοντέρνος».
    mode_calendar_limits: Το ημερολόγιο κρατά πάντα <strong>ακριβώς ένα 
      κατάλυμα</strong>. Αν έχουν διατεθεί πολλά δωμάτια, οι επισκέπτες μπορούν 
      να εναλλάσσονται μεταξύ τους — αλλά η εναλλαγή απορρίπτει την τρέχουσα 
      επιλογή και δεν μπορούν να κρατηθούν πολλά δωμάτια μαζί. Γι' αυτό υπάρχει 
      η αναζήτηση.<br><br>Τα δωμάτια που έχουν ρυθμιστεί για <strong>πολλαπλή 
      κατάληψη</strong> δεν εμφανίζονται στο ημερολόγιο, επειδή οι 
      διανυκτερεύσεις τους μοιράζονται μεταξύ πολλών κρατήσεων. Παραμένουν 
      διαθέσιμα για κράτηση μέσω της αναζήτησης.
    calendar_needs_modern: Το ημερολόγιο εμφανίζεται μόνο με τον σχεδιασμό 
      «Μοντέρνος». Όσο είναι επιλεγμένος ο «Κλασικός», οι επισκέπτες συνεχίζουν 
      να βλέπουν την αναζήτηση.
    calendar_no_rooms: 'Το ημερολόγιο δεν εμφανίζεται αυτήν τη στιγμή: κανένα από
      τα διατεθειμένα δωμάτια δεν είναι κατάλληλο. Τα δωμάτια με πολλαπλή κατάληψη
      εξαιρούνται, επειδή οι διανυκτερεύσεις τους μοιράζονται μεταξύ πολλών κρατήσεων.
      Διαθέστε ένα δωμάτιο χωρίς πολλαπλή κατάληψη για να εμφανιστεί το ημερολόγιο.'
    calendar_many_rooms: '%count% δωμάτια έχουν διατεθεί για το ημερολόγιο. Εκεί οι
      επισκέπτες μπορούν να επιλέξουν μόνο ένα κατάλυμα ανά κράτηση — με πολλά δωμάτια
      η αναζήτηση είναι συνήθως η καλύτερη επιλογή.'
    custom_css: Προσαρμοσμένο CSS
    custom_css_help: 'Για προχωρημένους: Προσαρμοσμένοι κανόνες CSS που φορτώνονται
      μετά τα προεπιλεγμένα στυλ. Χρησιμοποιήστε τους για να αλλάξετε γραμματοσειρές,
      χρώματα, αποστάσεις κ.λπ. Προτάξτε στους επιλογείς το <code>.fhb-booking-root</code>.
      Ο σχεδιασμός «Μοντέρνος» διαθέτει επιπλέον τις μεταβλητές <code>--fhb-primary</code>,
      <code>--fhb-bg</code>, <code>--fhb-surface</code>, <code>--fhb-text</code>,
      <code>--fhb-border</code>, <code>--fhb-radius</code>, <code>--fhb-shadow</code>,
      <code>--fhb-font-family</code> και <code>--fhb-space</code>.'
    confirmation_workflow_help: Η επιβεβαίωση προς τον επισκέπτη διεκπεραιώνεται
      ως αυτοματισμός. Ρυθμίστε εκεί το πρότυπο, τα συνημμένα και πρόσθετες 
      συνθήκες ή απενεργοποιήστε εντελώς την αποστολή.
    confirmation_workflow_missing: Λείπει ο αυτοματισμός επιβεβαίωσης επισκέπτη.
      Εκτελέστε τις εκκρεμείς μετεγκαταστάσεις (migrations) της βάσης δεδομένων.

    allowed_embedding_origins_help: "Trage jede Webseite in eine eigene Zeile ein, in die das Buchungsformular eingebettet werden soll. Wichtig: Varianten zählen einzeln, z.B. <code>https://www.meine-pension.de</code> und <code>https://meine-pension.de</code>. Wenn die Webseite auch über weitere Adressen erreichbar ist, müssen diese ebenfalls eingetragen werden. Leer lassen, wenn das Buchungsformular nur direkt aufgerufen wird."

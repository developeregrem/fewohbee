    mode_search: "Suche"
    mode_search_help: "Gäste geben Zeitraum, Personenzahl und Zimmeranzahl ein und wählen aus den passenden Zimmertypen. Der richtige Weg, sobald mehr als ein Zimmer buchbar ist."
    mode_calendar: "Kalender"
    mode_calendar_help: "Gäste sehen die Belegung einer Unterkunft und wählen ihren Zeitraum direkt im Kalender. Empfohlen für Einzelobjekte. Erfordert das Design „Modern“."
    mode_calendar_limits: "Im Kalender wird immer <strong>genau eine Unterkunft</strong> gebucht. Sind mehrere Zimmer freigegeben, kann der Gast zwischen ihnen umschalten – beim Wechsel wird die bisherige Auswahl aber verworfen, und mehrere Zimmer lassen sich nicht in einem Vorgang buchen. Dafür ist die Suche gedacht.<br><br>Zimmer, die als <strong>Mehrfachbelegung</strong> konfiguriert sind, erscheinen nicht im Kalender, weil sich ihre Nächte mehrere Buchungen teilen. Über die Suche bleiben sie buchbar."
    calendar_needs_modern: "Der Kalender erscheint erst mit dem Design „Modern“. Solange „Klassisch“ eingestellt ist, sehen Gäste weiterhin die Suche."
    calendar_no_rooms: "Der Kalender wird derzeit nicht angezeigt: Keines der freigegebenen Zimmer ist dafür geeignet. Zimmer mit Mehrfachbelegung sind ausgenommen, weil sich ihre Nächte mehrere Buchungen teilen. Gib ein Zimmer ohne Mehrfachbelegung frei, damit der Kalender erscheint."
    calendar_many_rooms: "Es sind %count% Zimmer für den Kalender freigegeben. Gäste können darin nur eine Unterkunft pro Buchung wählen – bei mehreren Zimmern ist die Suche in der Regel die bessere Wahl."
    custom_css: "Eigenes CSS"
    custom_css_help: "Fortgeschritten: Eigene CSS-Regeln, die nach den Standardstilen geladen werden. Damit lassen sich Schriftart, Farben, Abstände usw. frei anpassen. Verwende den Selektor <code>.fhb-booking-root</code> als Prefix. Im Design „Modern“ lassen sich außerdem die Variablen <code>--fhb-primary</code>, <code>--fhb-bg</code>, <code>--fhb-surface</code>, <code>--fhb-text</code>, <code>--fhb-border</code>, <code>--fhb-radius</code>, <code>--fhb-shadow</code>, <code>--fhb-font-family</code> und <code>--fhb-space</code> überschreiben."

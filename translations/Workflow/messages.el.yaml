      name: 'Παράδειγμα: Αποστολή τιμολογίου μέσω email'
      description: Στέλνει κάθε νέο τιμολόγιο στη διεύθυνση email τιμολογίων, με
        το τιμολόγιο συνημμένο ως PDF ηλεκτρονικού τιμολογίου όταν είναι δυνατό 
        (απαιτείται πρότυπο email).

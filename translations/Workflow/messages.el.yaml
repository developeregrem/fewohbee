      η πηγή είναι «Χειροκίνητα». Χωρίς συνθήκη που να το περιορίζει, 
      καταχωρίζεται κάθε τιμολόγιο.
    percentage_entry_amount_base: Βάση υπολογισμού
    percentage_entry_amount_base_help: 'Το ποσό στο οποίο εφαρμόζεται το ποσοστό.
      Το «Τμήμα του μικτού ποσού τιμολογίου που υπόκειται σε προμήθεια» παραλείπει
      ό,τι δεν χρεώνει προμήθεια μια πύλη: έναν φόρο διαμονής που τιμολογείται χωριστά
      και ό,τι δεν ήταν μέρος της κράτησης μέσω πύλης - ορίζεται στην τιμή ή στη γραμμή
      του τιμολογίου.'

    percentage_entry_requires_document_help: Η εγγραφή χρονολογείται την ημέρα 
      εκτέλεσης του αυτοματισμού και ανήκει σε εκείνον τον μήνα. Τη σημειώνει ως
      «Λείπει παραστατικό» όσο δεν έχει συμπληρωθεί αριθμός παραστατικού. Ο 
      μήνας μπορεί τότε να κλείσει μόνο αφού αυτός δοθεί. Ορίστε «Όχι» όταν δεν 
      εκδίδεται ξεχωριστό παραστατικό για αυτήν την κράτηση ποσού.

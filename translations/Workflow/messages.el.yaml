      name: 'Παράδειγμα: Αλλαγή κατάστασης κράτησης κατά την πληρωμή'
      description: Αλλάζει την κατάσταση κράτησης όλων των συνδεδεμένων 
        κρατήσεων όταν ένα τιμολόγιο σημειώνεται ως εξοφλημένο.

templates.editor.misc.positions: Γραμμές διαφόρων
templates.editor.misc.positions.desc: Εισάγει έναν πίνακα με όλες τις γραμμές 
  διαφόρων του τιμολογίου. Οι φόροι διαμονής, οι προσαυξήσεις και οι εκπτώσεις 
  εξαιρούνται, επειδή έχουν δικά τους αποσπάσματα.
templates.editor.apartment_modifier.positions: Γραμμές προσαυξήσεων / εκπτώσεων
templates.editor.apartment_modifier.positions.desc: Εισάγει έναν πίνακα με όλες 
  τις γραμμές προσαυξήσεων / εκπτώσεων δωματίων. Ο πίνακας εμφανίζεται μόνο όταν
  υπάρχουν τέτοιες γραμμές στο τιμολόγιο.
templates.editor.origin_name: Πύλη με χρεώσεις (όνομα)
templates.editor.origin_name.desc: Εισάγει το όνομα της πύλης, δηλαδή την 
  προέλευση κράτησης (π.χ. Booking.com). Εμφανίζεται μόνο όταν έχει οριστεί 
  προμήθεια ή χρέωση πληρωμής για αυτήν την προέλευση κράτησης και παραλείπεται,
  για παράδειγμα, στις απευθείας κρατήσεις.
templates.editor.origin_commission: Προμήθεια OTA
templates.editor.origin_commission.desc: Εισάγει την προμήθεια της πύλης 
  κρατήσεων ως ποσό. Παραλείπεται όταν δεν ισχύει προμήθεια ή όταν οι κρατήσεις 
  του τιμολογίου έγιναν με διαφορετικούς συντελεστές.
templates.editor.origin_payment_fee: Χρέωση πληρωμής OTA
templates.editor.origin_payment_fee.desc: Εισάγει τη χρέωση πληρωμής της πύλης 
  κρατήσεων ως ποσό. Παραλείπεται όταν δεν ισχύει χρέωση πληρωμής ή όταν οι 
  κρατήσεις του τιμολογίου διαφέρουν ως προς τον συντελεστή ή τον τρόπο πληρωμής
  τους.
templates.editor.tourist_tax.positions: Γραμμές φόρου διαμονής
templates.editor.opening_hours: Ώρες λειτουργίας του καταλύματος
templates.editor.check_in_times: Ώρες check-in του καταλύματος
templates.editor.guest_checkin_link: Σύνδεσμος online check-in
templates.editor.guest_checkin_link.desc: Σύνδεσμος με τον οποίο ο επισκέπτης 
  συμπληρώνει την ώρα άφιξης και τα στοιχεία εγγραφής πριν φτάσει. Κάθε κράτηση 
  έχει τον δικό της σύνδεσμο. Η παράγραφος παραλείπεται όσο το online check-in 
  είναι απενεργοποιημένο, για ακυρωμένες κρατήσεις και μετά την αναχώρηση.
templates.editor.guest_checkin_qr: Κωδικός QR online check-in
templates.editor.guest_checkin_qr.desc: Κωδικός QR του συνδέσμου online 
  check-in, π.χ. για μια εκτυπωμένη επιβεβαίωση κράτησης. Ο αριθμός είναι η 
  ανάλυση της εικόνας σε pixel. Ο κωδικός παραλείπεται όποτε παραλείπεται και ο 
  σύνδεσμος.
templates.editor.check_in_times.desc: Εκτυπώνει το διάστημα check-in και την ώρα
  check-out του καταλύματος σε μία γραμμή, π.χ. "Check-in 17:00-20:00 - 
  Check-out έως 10:00". Πρόκειται για κανόνες του καταλύματος, όχι για την ώρα 
  άφιξης της συγκεκριμένης κράτησης. Η παράγραφος παραλείπεται όταν δεν έχουν 
  ρυθμιστεί ώρες.
templates.editor.opening_hours.desc: Εκτυπώνει τις εβδομαδιαίες ώρες λειτουργίας
  του καταλύματος σε μία γραμμή, π.χ. "Δευ–Παρ 08:00–12:00, 16:00–19:00". Η 
  παράγραφος παραλείπεται όταν δεν έχουν ρυθμιστεί ώρες.
templates.editor.payment_qr: Κωδικός QR πληρωμής (GiroCode)
templates.editor.payment_qr.desc: Εισάγει έναν κωδικό QR που συμπληρώνει μια 
  μεταφορά SEPA στην τραπεζική εφαρμογή του πληρωτή. Ο αριθμός είναι η ανάλυση 
  της εικόνας σε pixel· το πόσο μεγάλη εμφανίζεται στη σελίδα καθορίζεται από το
  πλάτος της ίδιας της εικόνας, το οποίο ορίζει η λαβή αλλαγής μεγέθους. Ο 
  κωδικός εμφανίζεται μόνο όταν τα τραπεζικά στοιχεία έχουν ρυθμιστεί στις 
  ρυθμίσεις τιμολογίων και η εγκατάσταση λειτουργεί σε ευρώ.
templates.editor.payment_due_date: Ημερομηνία λήξης πληρωμής
templates.editor.payment_due_date.desc: Εισάγει την ημερομηνία λήξης του 
  τιμολογίου. Συμπληρώνεται εκ των προτέρων από την προθεσμία πληρωμής των 
  ρυθμίσεων τιμολογίων κατά τη δημιουργία του τιμολογίου και μπορεί να αλλάξει 
  ανά τιμολόγιο· η εκτυπωμένη ημερομηνία και το ηλεκτρονικό τιμολόγιο συμφωνούν 
  πάντα. Η γραμμή παραλείπεται όταν το τιμολόγιο δεν έχει ημερομηνία λήξης.
templates.editor.tourist_tax.positions.desc: Εισάγει έναν πίνακα με όλες τις 
  γραμμές φόρου διαμονής / φόρου καταλύματος. Ο πίνακας εμφανίζεται μόνο όταν 
  υπάρχουν τέτοιες γραμμές στο τιμολόγιο.

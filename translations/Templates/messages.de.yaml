templates.editor.apartment_modifier.positions: 'Liste der Aufschläge / Ermäßigungen'
templates.editor.apartment_modifier.positions.desc: 'Fügt eine Tabelle mit allen Aufschlag- und Ermäßigungspositionen ein. Die Tabelle wird nur angezeigt, wenn entsprechende Positionen auf der Rechnung vorhanden sind.'
templates.editor.origin_name: 'Portal mit Gebühren (Name)'
templates.editor.origin_name.desc: 'Fügt den Namen des Portals ein, also der Reservierungsherkunft der Buchung (z. B. Booking.com). Die Angabe erscheint nur, wenn für diese Reservierungsherkunft eine Kommission oder Zahlungsgebühr hinterlegt ist, und entfällt z. B. bei Direktbuchungen.'
templates.editor.origin_commission: OTA-Kommission
templates.editor.origin_commission.desc: 'Fügt die Kommission des Buchungsportals als Betrag ein. Die Angabe entfällt, wenn keine Kommission anfällt oder die Reservierungen der Rechnung zu unterschiedlichen Sätzen gebucht wurden.'
templates.editor.origin_payment_fee: OTA-Zahlungsgebühr
templates.editor.origin_payment_fee.desc: 'Fügt die Zahlungsgebühr des Buchungsportals als Betrag ein. Die Angabe entfällt, wenn keine Zahlungsgebühr anfällt oder sich die Reservierungen der Rechnung in Satz oder Zahlungsweg unterscheiden.'
templates.editor.tourist_tax.positions: 'Liste der Beherbergungsabgabe'
templates.editor.opening_hours: 'Öffnungszeiten der Niederlassung'
templates.editor.check_in_times: 'Check-in-Zeiten des Betriebs'
templates.editor.guest_checkin_link: 'Link zum Online-Check-in'
templates.editor.guest_checkin_link.desc: 'Link, über den der Gast vor der Anreise Anreisezeit und Meldedaten angibt. Jede Reservierung bekommt ihren eigenen Link. Der Absatz entfällt, solange der Online-Check-in ausgeschaltet ist, bei stornierten Reservierungen und nach der Abreise.'
templates.editor.guest_checkin_qr: 'QR-Code zum Online-Check-in'
templates.editor.guest_checkin_qr.desc: 'QR-Code des Online-Check-in-Links, z. B. für eine ausgedruckte Buchungsbestätigung. Die Zahl ist die Bildauflösung in Pixeln. Der Code entfällt immer dann, wenn auch der Link entfällt.'
templates.editor.check_in_times.desc: 'Gibt Check-in-Fenster und Check-out-Zeit des Betriebs als eine Zeile aus, z. B. „Check-in 17:00–20:00 Uhr · Check-out bis 10:00 Uhr“. Das sind Hausregeln, nicht die Anreisezeit dieser Reservierung. Der Absatz entfällt, wenn keine Zeiten hinterlegt sind.'
templates.editor.opening_hours.desc: 'Gibt die wöchentlichen Öffnungszeiten der Niederlassung als eine Zeile aus, z. B. „Mo.–Fr. 08:00–12:00, 16:00–19:00". Sind keine Zeiten hinterlegt, entfällt der Absatz.'
templates.editor.payment_qr: 'Zahlungs-QR-Code (GiroCode)'
templates.editor.payment_qr.desc: 'Fügt einen QR-Code ein, der in der Banking-App des Zahlenden eine SEPA-Überweisung vorausfüllt. Die Zahl ist die Auflösung des Bildes in Pixeln; wie groß es auf der Seite erscheint, bestimmt die Breite des Bildes, die du am Ziehpunkt einstellst. Der Code erscheint nur, wenn in den Rechnungseinstellungen eine Bankverbindung hinterlegt ist und die Installation in Euro rechnet.'
templates.editor.payment_due_date: Fälligkeitsdatum
templates.editor.payment_due_date.desc: 'Fügt das Fälligkeitsdatum der Rechnung ein. Es wird beim Erstellen aus dem Zahlungsziel in den Rechnungseinstellungen vorbelegt und lässt sich pro Rechnung ändern; gedrucktes Datum und E-Rechnung stimmen immer überein. Hat die Rechnung kein Fälligkeitsdatum, entfällt die Zeile.'
templates.editor.tourist_tax.positions.desc: 'Fügt eine Tabelle mit allen Beherbergungsabgabe-/Kurtaxe-Positionen ein. Die Tabelle wird nur angezeigt, wenn entsprechende Positionen auf der Rechnung vorhanden sind.'
templates.editor.misc.total: 'Gesamtpreis aller Sonstigepositionen'

parameters:
    customFontDirectory: '%kernel.cache_dir%/uploaded-font-storage'
    # Operator switch on, so functional tests can exercise the MCP endpoint; the administrator
    # switch in AppSettings still decides per test.
    mcp_enabled: true

services:
    _defaults:
        public: true

    # If you need to access services in a test, create an alias
    # and then fetch that alias from the container. As a convention,
    # aliases are prefixed with test. For example:
    #
    # test.App\Service\MyService: '@App\Service\MyService'

    App\Service\CustomFontManager:
        autowire: true
        arguments:
            $storage: '@fonts.storage'
            $fontCacheDirectory: '%kernel.cache_dir%/uploaded-font-cache'
            $analysisCacheDirectory: '%kernel.cache_dir%/font-analysis'

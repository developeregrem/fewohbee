parameters:
    # fallback parameters
    env(USE_PASSWORD_BLACKLIST): 'true'
    env(PASSKEY_ENABLED): 'false'
    # OIDC single sign-on; disabled unless a provider is configured
    env(OIDC_ENABLED): 'false'
    env(OIDC_ISSUER): ''
    env(OIDC_CLIENT_ID): ''
    env(OIDC_CLIENT_SECRET): ''
    env(OIDC_SCOPES): 'openid profile email'
    env(OIDC_BUTTON_LABEL): ''
    env(OIDC_USER_MATCHING): 'email'
    env(OIDC_REQUIRE_VERIFIED_EMAIL): 'true'
    env(OIDC_ENFORCE): 'false'
    env(OIDC_END_SESSION): 'false'
    env(TRUSTED_PROXIES): ''

framework:
    secret: '%env(APP_SECRET)%'
    trusted_proxies: '%env(trim:TRUSTED_PROXIES)%'
    trusted_headers: [ 'x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix' ]
    #default_locale: en
    #csrf_protection: true
    http_method_override: false

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: 'auto'
        cookie_samesite: 'lax'
        storage_factory_id: session.storage.factory.native

    #esi: true
    #fragments: true
    php_errors:
        log: true

    rate_limiter:
        public_booking_availability:
            policy: 'sliding_window'
            limit: 20
            interval: '5 minutes'
            cache_pool: cache.app
        public_booking_submit:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
            cache_pool: cache.app
        # Each "load more months" in the booking calendar is one request, so this
        # sits well above the form limits while still capping occupancy scraping.
        public_booking_calendar:
            policy: 'sliding_window'
            limit: 40
            interval: '5 minutes'
            cache_pool: cache.app
        api:
            policy: 'sliding_window'
            limit: 300
            interval: '5 minutes'
            cache_pool: cache.app
        api_auth_failure:
            policy: 'sliding_window'
            limit: 20
            interval: '15 minutes'
            cache_pool: cache.app
        # Guards the OIDC callback: every hit triggers an outbound token request,
        # so cap how often an unauthenticated client can force one.
        oidc_callback:
            policy: 'sliding_window'
            limit: 20
            interval: '5 minutes'
            cache_pool: cache.app

    cache:
        # Put the unique name of your app here: the prefix seed
        # is used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The app cache caches to the filesystem by default.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu
        
when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        validation:
            not_compromised_password:
                enabled: false
        rate_limiter:
            # Generous limits so repeated test runs never trip the limiters.
            api:
                policy: 'sliding_window'
                limit: 10000
                interval: '5 minutes'
                cache_pool: cache.app
            api_auth_failure:
                policy: 'sliding_window'
                limit: 10000
                interval: '15 minutes'
                cache_pool: cache.app
            oidc_callback:
                policy: 'sliding_window'
                limit: 10000
                interval: '5 minutes'
                cache_pool: cache.app

when@dev:
    framework:
        validation:
            not_compromised_password:
                enabled: false

when@prod:
    framework:
        validation:
            not_compromised_password:
                enabled: '%env(bool:USE_PASSWORD_BLACKLIST)%'

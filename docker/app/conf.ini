date.timezone=${TZ}

opcache.enable=1
opcache.enable_cli=1
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.memory_consumption=128
opcache.save_comments=1
opcache.revalidate_freq=1
opcache.jit_buffer_size=100M

session.save_handler = redis
; REDIS_SESSION_IDX/REDIS_PREFIX are normalized by the container entrypoints.
; Keeping sessions in their own logical database prevents cache-pool clears from
; touching them; the prefix isolates tenants that share the same Redis instance.
session.save_path = "tcp://${REDIS_HOST}:${REDIS_PORT}?database=${REDIS_SESSION_IDX}&prefix=${REDIS_PREFIX}session_"

; Keep idle sessions short. Deployments can override the default through a real
; container environment variable (Symfony's .env is loaded too late for php.ini).
session.gc_maxlifetime = ${SESSION_MAX_LIFETIME}
session.use_strict_mode = 1
session.cookie_httponly = 1

; Serialize concurrent writes to one session. Without locking, two parallel
; requests can overwrite each other's session data with stale snapshots.
redis.session.locking_enabled = 1
redis.session.lock_expire = 30
redis.session.lock_retries = 500
redis.session.lock_wait_time = 20000
redis.session.lock_failure_readonly = 1

expose_php = Off

display_errors = 0
error_reporting = E_ALL
log_errors = On

upload_max_filesize = 10M
post_max_size = 12M
